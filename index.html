<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle Financeiro Pessoal</title>
<meta name="theme-color" content="#0ea5e9">
<meta name="description" content="Sistema pessoal de controle financeiro — 100% local, sem servidor.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body>

<div id="app" class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">💰</span>
      <span class="brand-name">Meu Financeiro</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button class="btn-ghost" id="btnToggleTheme">🌗 Tema</button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnOpenMenu">☰</button>
      <h1 class="topbar-title" id="topbarTitle">Dashboard</h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnSearch" title="Buscar">🔎</button>
      </div>
    </header>

    <main class="view-container" id="view"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <button class="fab" id="fabAdd" title="Adicionar">+</button>
  <div class="fab-menu" id="fabMenu"></div>
  <div class="fab-backdrop" id="fabBackdrop"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <h2 id="modalTitle">Título</h2>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar lançamentos, faturas, contas, categorias…" autocomplete="off">
    <button class="icon-btn" id="searchClose">✕</button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/finance.js"></script>
<script src="js/categories.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/accounts.js"></script>
<script src="js/creditCards.js"></script>
<script src="js/invoices.js"></script>
<script src="js/recurring.js"></script>
<script src="js/transactions.js"></script>
<script src="js/loans.js"></script>
<script src="js/investments.js"></script>
<script src="js/goals.js"></script>
<script src="js/calendar.js"></script>
<script src="js/reports.js"></script>
<script src="js/projection.js"></script>
<script src="js/patrimonio.js"></script>
<script src="js/backup.js"></script>
<script src="js/settings.js"></script>
<script src="js/seed.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
