<style>
/* ===== css/style.css ===== */
:root {
  --color-bg: #f4f6f9;
  --color-surface: #ffffff;
  --color-surface-alt: #f8fafc;
  --color-border: #e5e9f0;
  --color-text: #1e2733;
  --color-text-muted: #6b7688;
  --color-text-faint: #9aa4b2;

  --color-primary: #0ea5e9;
  --color-primary-dark: #0284c7;
  --color-primary-contrast: #ffffff;

  --color-income: #16a34a;
  --color-income-bg: #ecfdf3;
  --color-expense: #dc2626;
  --color-expense-bg: #fef2f2;
  --color-info: #2563eb;
  --color-info-bg: #eff6ff;
  --color-invest: #7c3aed;
  --color-invest-bg: #f3ecff;
  --color-card: #ea580c;
  --color-card-bg: #fff3ea;
  --color-neutral: #64748b;
  --color-neutral-bg: #f1f5f9;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px rgba(20, 30, 50, 0.06);
  --shadow-md: 0 6px 20px rgba(20, 30, 50, 0.08);
  --shadow-lg: 0 12px 36px rgba(20, 30, 50, 0.14);

  --sidebar-w: 248px;
  --topbar-h: 60px;
  --bottom-nav-h: 62px;

  color-scheme: light;
}

:root[data-theme="dark"] {
  --color-bg: #0f1520;
  --color-surface: #161d2b;
  --color-surface-alt: #1c2436;
  --color-border: #2a3346;
  --color-text: #e7ecf4;
  --color-text-muted: #9aa7bd;
  --color-text-faint: #6b7688;
  --color-income-bg: #0d2818;
  --color-expense-bg: #2a1414;
  --color-info-bg: #0f2038;
  --color-invest-bg: #1f1633;
  --color-card-bg: #2a1a0d;
  --color-neutral-bg: #202838;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; font-size: 14px; }

a { color: var(--color-primary); }

.app { display: flex; min-height: 100vh; }

/* ---------- Sidebar ---------- */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 18px; font-weight: 700; font-size: 17px;
}
.brand-icon { font-size: 22px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 10px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--color-text-muted); cursor: pointer;
  margin-bottom: 2px; text-decoration: none; font-size: 14px; font-weight: 500;
  border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--color-surface-alt); color: var(--color-text); }
.nav-item.active { background: var(--color-primary); color: #fff; }
.nav-icon { font-size: 17px; width: 20px; text-align: center; }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--color-border); }

/* ---------- Topbar ---------- */
.main-wrapper { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px; background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  position: sticky; top: 0; z-index: 20;
}
.topbar-title { font-size: 18px; margin: 0; flex: 1; }
.topbar-actions { display: flex; gap: 8px; }

.view-container { padding: 20px; max-width: 1280px; width: 100%; margin: 0 auto; padding-bottom: 90px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--radius-sm); border: none;
  background: var(--color-primary); color: #fff; font-weight: 600; cursor: pointer;
  transition: filter .15s, transform .05s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(0.98); }
.btn-secondary { background: var(--color-neutral-bg); color: var(--color-text); }
.btn-danger { background: var(--color-expense); }
.btn-ghost { background: transparent; color: var(--color-text-muted); border: 1px solid var(--color-border); }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 10px; font-size: 12.5px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: transparent; cursor: pointer; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted);
}
.icon-btn:hover { background: var(--color-surface-alt); color: var(--color-text); }

/* ---------- Cards ---------- */
.card {
  background: var(--color-surface); border-radius: var(--radius-md);
  padding: 18px; box-shadow: var(--shadow-sm); border: 1px solid var(--color-border);
}
.card-title { font-size: 13px; color: var(--color-text-muted); margin: 0 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.card-value { font-size: 24px; font-weight: 700; margin: 0; }
.card-sub { font-size: 12.5px; color: var(--color-text-muted); margin-top: 4px; }

.section { margin-bottom: 26px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
.section-header h2 { font-size: 16px; margin: 0; }

/* ---------- Forms ---------- */
.form-group { margin-bottom: 14px; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; min-width: 0; }
label { display: block; font-size: 12.5px; font-weight: 600; color: var(--color-text-muted); margin-bottom: 5px; }
input[type="text"], input[type="number"], input[type="date"], input[type="password"],
input[type="search"], select, textarea {
  width: 100%; padding: 9px 11px; border-radius: var(--radius-sm);
  border: 1px solid var(--color-border); background: var(--color-surface-alt);
  color: var(--color-text); outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--color-primary); }
textarea { resize: vertical; min-height: 60px; }
.checkbox-row { display: flex; align-items: center; gap: 8px; }
.checkbox-row input { width: auto; }
.field-hint { font-size: 11.5px; color: var(--color-text-faint); margin-top: 4px; }
.segmented { display: flex; gap: 6px; flex-wrap: wrap; }
.segmented button {
  padding: 7px 13px; border-radius: 999px; border: 1px solid var(--color-border);
  background: var(--color-surface-alt); color: var(--color-text-muted); cursor: pointer; font-size: 13px;
}
.segmented button.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
fieldset { border: 1px dashed var(--color-border); border-radius: var(--radius-sm); padding: 12px; margin: 0 0 14px; }
legend { padding: 0 6px; font-size: 12px; font-weight: 700; color: var(--color-text-muted); }

/* ---------- Tables / lists ---------- */
.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.data-table th { text-align: left; padding: 10px 12px; color: var(--color-text-muted); font-weight: 600; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
.data-table tr:hover td { background: var(--color-surface-alt); }
.table-wrap { overflow-x: auto; background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border); }

.list-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border-bottom: 1px solid var(--color-border); background: var(--color-surface);
}
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: var(--color-surface-alt); }
.list-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.list-main { flex: 1; min-width: 0; }
.list-title { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-meta { font-size: 12px; color: var(--color-text-muted); }
.list-value { font-weight: 700; font-size: 14px; white-space: nowrap; }
.list-card { border-radius: var(--radius-md); border: 1px solid var(--color-border); overflow: hidden; }

.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.badge-income { background: var(--color-income-bg); color: var(--color-income); }
.badge-expense { background: var(--color-expense-bg); color: var(--color-expense); }
.badge-info { background: var(--color-info-bg); color: var(--color-info); }
.badge-invest { background: var(--color-invest-bg); color: var(--color-invest); }
.badge-card { background: var(--color-card-bg); color: var(--color-card); }
.badge-neutral { background: var(--color-neutral-bg); color: var(--color-neutral); }

.text-income { color: var(--color-income); }
.text-expense { color: var(--color-expense); }
.text-muted { color: var(--color-text-muted); }
.text-invest { color: var(--color-invest); }

.empty-state { text-align: center; padding: 50px 20px; color: var(--color-text-muted); }
.empty-state .emoji { font-size: 40px; display: block; margin-bottom: 10px; }

.progress-bar { height: 10px; border-radius: 999px; background: var(--color-neutral-bg); overflow: hidden; }
.progress-bar > div { height: 100%; background: var(--color-primary); border-radius: 999px; transition: width .3s; }

.filters-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-end; }
.filters-bar .form-group { margin-bottom: 0; min-width: 130px; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(10, 15, 25, 0.5);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--color-surface); border-radius: var(--radius-lg);
  width: 100%; max-width: 560px; max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
}
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--color-border); }
.modal-header h2 { font-size: 16px; margin: 0; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.modal.modal-wide { max-width: 820px; }

/* ---------- FAB ---------- */
.fab {
  position: fixed; right: 24px; bottom: 24px; width: 58px; height: 58px; border-radius: 50%;
  background: var(--color-primary); color: #fff; border: none; font-size: 30px; font-weight: 300;
  box-shadow: var(--shadow-lg); cursor: pointer; z-index: 60; line-height: 1;
}
.fab-menu {
  position: fixed; right: 24px; bottom: 92px; display: none; flex-direction: column; gap: 10px; z-index: 61; align-items: flex-end;
}
.fab-menu.open { display: flex; }
.fab-menu button {
  display: flex; align-items: center; gap: 10px; background: var(--color-surface);
  border: 1px solid var(--color-border); padding: 10px 16px; border-radius: 999px;
  box-shadow: var(--shadow-md); font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--color-text);
  white-space: nowrap;
}
.fab-backdrop { position: fixed; inset: 0; background: rgba(10,15,25,.3); display: none; z-index: 55; }
.fab-backdrop.open { display: block; }

/* ---------- Bottom nav (mobile) ---------- */
.bottom-nav { display: none; }

/* ---------- Toast ---------- */
.toast-container { position: fixed; top: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--color-text); color: var(--color-surface); padding: 11px 16px; border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md); font-size: 13.5px; max-width: 320px; animation: toast-in .2s ease-out;
}
.toast.success { background: var(--color-income); color: #fff; }
.toast.error { background: var(--color-expense); color: #fff; }
.toast.info { background: var(--color-info); color: #fff; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- Search overlay ---------- */
.search-overlay { position: fixed; inset: 0; background: var(--color-bg); z-index: 150; display: none; flex-direction: column; }
.search-overlay.open { display: flex; }
.search-box { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--color-border); background: var(--color-surface); }
.search-box input { flex: 1; }
.search-results { flex: 1; overflow-y: auto; padding: 10px 18px; }
.search-group-title { font-size: 12px; text-transform: uppercase; color: var(--color-text-faint); margin: 16px 0 6px; font-weight: 700; }

.only-mobile { display: none; }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 4px 10px; border-radius: 999px; background: var(--color-neutral-bg); font-size: 11.5px; font-weight: 600; color: var(--color-text-muted); }

.alert-box { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--color-info-bg); color: var(--color-info); font-size: 13px; margin-bottom: 10px; align-items: flex-start; }
.alert-box.warn { background: var(--color-card-bg); color: var(--color-card); }
.alert-box.ok { background: var(--color-income-bg); color: var(--color-income); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--color-border); cursor: pointer; display: inline-block; }
.swatch.selected { border-color: var(--color-text); }

/* ---------- Calendário ---------- */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-grid.cal-header { margin-bottom: 6px; }
.cal-head-cell { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--color-text-muted); padding: 4px 0; }
.cal-cell {
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px;
  min-height: 92px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
}
.cal-cell:hover { border-color: var(--color-primary); }
.cal-cell.cal-empty { background: transparent; border: none; cursor: default; }
.cal-cell.cal-today { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary) inset; }
.cal-day-num { font-size: 12px; font-weight: 700; color: var(--color-text-muted); }
.cal-events { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.cal-event { font-size: 10px; padding: 2px 5px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.cal-event-more { font-size: 10px; color: var(--color-text-faint); padding-left: 4px; }

@media (max-width: 860px) {
  .cal-cell { min-height: 64px; }
  .cal-day-num { font-size: 11px; }
  .cal-event { font-size: 9px; }
}


/* ===== css/dashboard.css ===== */
.month-switcher {
  display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: 10px 14px; width: fit-content;
}
.month-switcher .month-label { font-weight: 700; font-size: 15px; min-width: 150px; text-align: center; }

.dashboard-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
}
.dashboard-card { position: relative; overflow: hidden; }
.dashboard-card .icon-bg { position: absolute; right: 10px; top: 10px; font-size: 34px; opacity: .12; }

.charts-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 24px; }
.chart-card { background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 18px; }
.chart-card h3 { margin: 0 0 12px; font-size: 14px; }
.chart-wrap { position: relative; height: 260px; }
.chart-wrap.small { height: 220px; }

.insights-list { display: flex; flex-direction: column; gap: 8px; }

.commitment-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.commitment-item { text-align: center; background: var(--color-surface-alt); border-radius: var(--radius-sm); padding: 14px 10px; }
.commitment-item .value { font-weight: 700; font-size: 16px; }
.commitment-item .label { font-size: 11.5px; color: var(--color-text-muted); margin-top: 3px; }


/* ===== css/responsive.css ===== */
@media (max-width: 1100px) {
  .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
  .charts-grid { grid-template-columns: 1fr; }
  .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .commitment-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 860px) {
  .sidebar {
    position: fixed; left: 0; top: 0; height: 100vh; z-index: 90;
    transform: translateX(-100%); transition: transform .2s ease-out;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .only-mobile { display: flex; }
  .main-wrapper { width: 100%; }

  .bottom-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottom-nav-h);
    background: var(--color-surface); border-top: 1px solid var(--color-border);
    z-index: 50; padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-nav .nav-item {
    flex: 1; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; border-radius: 0; padding: 6px 2px; font-size: 10.5px; margin: 0;
  }
  .bottom-nav .nav-item .nav-icon { font-size: 19px; }
  .bottom-nav .nav-item.active { background: none; color: var(--color-primary); }

<script>
/* ===== js/db.js ===== */
/* db.js — camada de acesso ao IndexedDB */

const DB_NAME = 'controleFinanceiroDB';
const DB_VERSION = 1;

const STORES = {
  accounts: 'id',
  categories: 'id',
  subcategories: 'id',
  creditCards: 'id',
  transactions: 'id',
  invoices: 'id',
  recurringTransactions: 'id',
  loans: 'id',
  investments: 'id',
  goals: 'id',
  settings: 'key'
};

let _dbPromise = null;

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (event) => {
      const db = event.target.result;

      if (!db.objectStoreNames.contains('accounts')) {
        db.createObjectStore('accounts', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('categories')) {
        db.createObjectStore('categories', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('subcategories')) {
        const s = db.createObjectStore('subcategories', { keyPath: 'id' });
        s.createIndex('categoriaId', 'categoriaId', { unique: false });
      }
      if (!db.objectStoreNames.contains('creditCards')) {
        db.createObjectStore('creditCards', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('transactions')) {
        const t = db.createObjectStore('transactions', { keyPath: 'id' });
        t.createIndex('data', 'data', { unique: false });
        t.createIndex('tipo', 'tipo', { unique: false });
        t.createIndex('contaId', 'contaId', { unique: false });
        t.createIndex('cartaoId', 'cartaoId', { unique: false });
        t.createIndex('faturaCompetencia', 'faturaCompetencia', { unique: false });
        t.createIndex('compraId', 'compraId', { unique: false });
        t.createIndex('recorrenciaId', 'recorrenciaId', { unique: false });
        t.createIndex('investimentoId', 'investimentoId', { unique: false });
        t.createIndex('emprestimoId', 'emprestimoId', { unique: false });
        t.createIndex('categoriaId', 'categoriaId', { unique: false });
        t.createIndex('status', 'status', { unique: false });
      }
      if (!db.objectStoreNames.contains('invoices')) {
        const i = db.createObjectStore('invoices', { keyPath: 'id' });
        i.createIndex('cartaoId', 'cartaoId', { unique: false });
        i.createIndex('competencia', 'competencia', { unique: false });
        i.createIndex('cartaoCompetencia', ['cartaoId', 'competencia'], { unique: true });
      }
      if (!db.objectStoreNames.contains('recurringTransactions')) {
        db.createObjectStore('recurringTransactions', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('loans')) {
        db.createObjectStore('loans', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('investments')) {
        db.createObjectStore('investments', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('goals')) {
        db.createObjectStore('goals', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}

function tx(storeName, mode = 'readonly') {
  return openDB().then((db) => db.transaction(storeName, mode).objectStore(storeName));
}

const DB = {
  async getAll(storeName) {
    const store = await tx(storeName);
    return new Promise((resolve, reject) => {
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  async get(storeName, key) {
    const store = await tx(storeName);
    return new Promise((resolve, reject) => {
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  async getByIndex(storeName, indexName, value) {
    const store = await tx(storeName);
    return new Promise((resolve, reject) => {
      const req = store.index(indexName).getAll(value);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  async put(storeName, value) {
    const store = await tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      const req = store.put(value);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  async bulkPut(storeName, values) {
    const store = await tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      values.forEach((v) => store.put(v));
      store.transaction.oncomplete = () => resolve();
      store.transaction.onerror = () => reject(store.transaction.error);
    });
  },

  async delete(storeName, key) {
    const store = await tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      const req = store.delete(key);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  },

  async bulkDelete(storeName, keys) {
    const store = await tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      keys.forEach((k) => store.delete(k));
      store.transaction.oncomplete = () => resolve();
      store.transaction.onerror = () => reject(store.transaction.error);
    });
  },

  async clear(storeName) {
    const store = await tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      const req = store.clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  },

  async clearAll() {
    for (const name of Object.keys(STORES)) {
      await this.clear(name);
    }
  },

  async exportAll() {
    const dump = {};
    for (const name of Object.keys(STORES)) {
      dump[name] = await this.getAll(name);
    }
    dump._meta = { version: DB_VERSION, exportadoEm: new Date().toISOString() };
    return dump;
  },

  async importAll(dump) {
    for (const name of Object.keys(STORES)) {
      if (Array.isArray(dump[name])) {
        await this.clear(name);
        await this.bulkPut(name, dump[name]);
      }
    }
  }
};

function uid() {
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}


/* ===== js/utils.js ===== */
/* utils.js — formatação, datas e helpers genéricos */

const Utils = {
  formatCurrency(value) {
    const v = Number(value) || 0;
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  },

  parseCurrencyInput(str) {
    if (typeof str === 'number') return str;
    if (!str) return 0;
    const cleaned = String(str).replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3},)/g, '').replace(',', '.');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  },

  formatDateBR(isoDate) {
    if (!isoDate) return '';
    const [y, m, d] = isoDate.split('-');
    return `${d}/${m}/${y}`;
  },

  formatDateShort(isoDate) {
    if (!isoDate) return '';
    const [, m, d] = isoDate.split('-');
    return `${d}/${m}`;
  },

  todayISO() {
    return this.dateToISO(new Date());
  },

  dateToISO(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  },

  isoToDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  },

  currentCompetencia() {
    return this.dateToCompetencia(new Date());
  },

  dateToCompetencia(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    return `${y}-${m}`;
  },

  competenciaLabel(competencia) {
    const [y, m] = competencia.split('-').map(Number);
    const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    return `${meses[m - 1]}/${y}`;
  },

  competenciaLabelCurto(competencia) {
    const [y, m] = competencia.split('-').map(Number);
    const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    return `${meses[m - 1]}/${String(y).slice(2)}`;
  },

  addMonthsToCompetencia(competencia, n) {
    const [y, m] = competencia.split('-').map(Number);
    const date = new Date(y, m - 1 + n, 1);
    return this.dateToCompetencia(date);
  },

  compareCompetencia(a, b) {
    return a < b ? -1 : a > b ? 1 : 0;
  },

  addMonths(date, n) {
    const d = new Date(date.getFullYear(), date.getMonth() + n, 1);
    const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(date.getDate(), lastDay));
    return d;
  },

  addDays(date, n) {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  },

  daysInMonth(year, month) {
    return new Date(year, month + 1, 0).getDate();
  },

  clampDay(year, month, day) {
    return Math.min(day, this.daysInMonth(year, month));
  },

  diffInDays(a, b) {
    const ms = this.isoToDate(b) - this.isoToDate(a);
    return Math.round(ms / 86400000);
  },

  uuid() {
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  },

  escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  },

  round2(n) {
    return Math.round((n + Number.EPSILON) * 100) / 100;
  },

  debounce(fn, wait) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  },

  downloadFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  toCSVValue(v) {
    if (v == null) return '';
    const s = String(v);
    if (s.includes(';') || s.includes('"') || s.includes('\n')) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }
};


/* ===== js/finance.js ===== */
/* finance.js — motor central de regras financeiras.
   Toda a lógica de datas, faturas, parcelas, saldos e projeções vive aqui,
   isolada da interface, para evitar inconsistências (regra da seção 44/31). */

const Finance = {

  /* ===================== CARTÃO DE CRÉDITO ===================== */

  /**
   * Determina a que fatura (competência) uma compra pertence, considerando
   * o dia de fechamento do cartão — nunca o mês corrido da data da compra.
   * Regra: se o dia da compra for POSTERIOR ao fechamento, a compra cai na
   * fatura do mês seguinte.
   */
  calcularFaturaCartao(dataCompra, cartao) {
    const dia = dataCompra.getDate();
    let mesRef = dataCompra.getMonth();
    let anoRef = dataCompra.getFullYear();

    if (dia > cartao.diaFechamento) {
      mesRef += 1;
      if (mesRef > 11) { mesRef = 0; anoRef += 1; }
    }

    const diaFechClamp = Utils.clampDay(anoRef, mesRef, cartao.diaFechamento);
    const dataFechamento = new Date(anoRef, mesRef, diaFechClamp);

    let mesVenc = mesRef;
    let anoVenc = anoRef;
    if (cartao.diaVencimento <= cartao.diaFechamento) {
      mesVenc += 1;
      if (mesVenc > 11) { mesVenc = 0; anoVenc += 1; }
    }
    const diaVencClamp = Utils.clampDay(anoVenc, mesVenc, cartao.diaVencimento);
    const dataVencimento = new Date(anoVenc, mesVenc, diaVencClamp);

    const competencia = `${anoRef}-${String(mesRef + 1).padStart(2, '0')}`;
    return { competencia, dataFechamento, dataVencimento };
  },

  /**
   * Gera as N parcelas de uma compra no cartão, cada uma já associada à
   * fatura (competência) correta. A parcela 1 usa a fatura da data da
   * compra; cada parcela seguinte avança um mês a partir da compra, o que
   * naturalmente recai na fatura seguinte.
   */
  calcularParcelas({ dataCompra, valorTotal, numeroParcelas, cartao }) {
    const n = Math.max(1, numeroParcelas);
    const valorBase = Utils.round2(valorTotal / n);
    const parcelas = [];
    let somaParcial = 0;

    for (let i = 0; i < n; i++) {
      const dataRef = Utils.addMonths(dataCompra, i);
      const { competencia, dataVencimento } = this.calcularFaturaCartao(dataRef, cartao);
      let valor = valorBase;
      if (i === n - 1) {
        valor = Utils.round2(valorTotal - somaParcial);
      } else {
        somaParcial = Utils.round2(somaParcial + valorBase);
      }
      parcelas.push({
        numero: i + 1,
        total: n,
        valor,
        competencia,
        dataVencimento: Utils.dateToISO(dataVencimento)
      });
    }
    return parcelas;
  },

  /** Datas de fechamento/vencimento de uma fatura a partir da sua competência (YYYY-MM). */
  datasDaFatura(competencia, cartao) {
    const [y, m] = competencia.split('-').map(Number);
    const diaFech = Utils.clampDay(y, m - 1, cartao.diaFechamento);
    const dataFechamento = new Date(y, m - 1, diaFech);

    let anoVenc = y, mesVenc = m - 1;
    if (cartao.diaVencimento <= cartao.diaFechamento) {
      mesVenc += 1;
      if (mesVenc > 11) { mesVenc = 0; anoVenc += 1; }
    }
    const diaVenc = Utils.clampDay(anoVenc, mesVenc, cartao.diaVencimento);
    const dataVencimento = new Date(anoVenc, mesVenc, diaVenc);
    return { dataFechamento, dataVencimento };
  },

  /** Mês financeiro de uma transação: fatura do cartão, ou o mês da própria data. */
  getMesFinanceiro(t) {
    if (t.formaPagamento === 'creditoCartao' && t.faturaCompetencia) {
      return t.faturaCompetencia;
    }
    return t.data ? t.data.slice(0, 7) : '';
  },

  /* ===================== IMPACTO EM CONTA (fluxo de caixa) ===================== */

  /** Retorna o efeito (positivo/negativo) de uma transação sobre uma conta específica, na data de caixa (t.data). Só considera lançamentos efetivados. */
  impactoNaConta(t, contaId) {
    const realizados = ['paga', 'recebida'];
    if (!realizados.includes(t.status)) return 0;

    if (t.tipo === 'despesa' && t.formaPagamento !== 'creditoCartao' && t.contaId === contaId) {
      return -t.valor;
    }
    if (t.tipo === 'receita' && t.contaId === contaId) {
      return t.valor;
    }
    if (t.tipo === 'transferencia') {
      if (t.contaId === contaId) return -t.valor;
      if (t.contaDestinoId === contaId) return t.valor;
      return 0;
    }
    if (t.tipo === 'investimento' && t.contaId === contaId) {
      return -t.valor;
    }
    if (t.tipo === 'pagamentoFatura' && t.contaId === contaId) {
      return -t.valor;
    }
    return 0;
  },

  /** Saldo de caixa de uma conta (ou de todas, se contaId omitido) até uma data. */
  calcularSaldo(contas, transacoes, contaId, ateDataISO) {
    const ate = ateDataISO || Utils.todayISO();
    const listaContas = contaId ? contas.filter((c) => c.id === contaId) : contas;

    let saldo = 0;
    for (const conta of listaContas) {
      if (!conta.dataSaldoInicial || conta.dataSaldoInicial <= ate) {
        saldo += conta.saldoInicial || 0;
      }
    }

    for (const t of transacoes) {
      if (t.data > ate) continue;
      for (const conta of listaContas) {
        saldo += this.impactoNaConta(t, conta.id);
      }
    }
    return Utils.round2(saldo);
  },

  /* ===================== TOTAIS MENSAIS (competência) ===================== */

  calcularDespesasMes(transacoes, competencia) {
    return Utils.round2(
      transacoes
        .filter((t) => t.tipo === 'despesa' && t.status !== 'cancelada' && this.getMesFinanceiro(t) === competencia)
        .reduce((s, t) => s + t.valor, 0)
    );
  },

  calcularReceitasMes(transacoes, competencia) {
    return Utils.round2(
      transacoes
        .filter((t) => t.tipo === 'receita' && t.status !== 'cancelada' && t.data.slice(0, 7) === competencia)
        .reduce((s, t) => s + t.valor, 0)
    );
  },

  calcularInvestimentosMes(transacoes, competencia) {
    return Utils.round2(
      transacoes
        .filter((t) => t.tipo === 'investimento' && t.status !== 'cancelada' && t.data.slice(0, 7) === competencia)
        .reduce((s, t) => s + t.valor, 0)
    );
  },

  calcularDespesasPorCategoria(transacoes, competencia) {
    const mapa = {};
    transacoes
      .filter((t) => t.tipo === 'despesa' && t.status !== 'cancelada' && this.getMesFinanceiro(t) === competencia)
      .forEach((t) => {
        const key = t.categoriaId || 'sem-categoria';
        mapa[key] = Utils.round2((mapa[key] || 0) + t.valor);
      });
    return mapa;
  },

  /* ===================== COMPROMISSOS FUTUROS ===================== */

  calcularCompromissosFuturos(transacoes, diasHorizonte) {
    const hoje = Utils.todayISO();
    const limite = Utils.dateToISO(Utils.addDays(Utils.isoToDate(hoje), diasHorizonte));

    const pendentes = transacoes.filter((t) =>
      t.tipo === 'despesa' && ['prevista', 'pendente'].includes(t.status)
    );

    const porGrupo = { contasFixas: 0, cartoes: 0, emprestimos: 0, outros: 0, total: 0 };

    for (const t of pendentes) {
      const dataRelevante = t.formaPagamento === 'creditoCartao' && t.dataVencimentoFatura
        ? t.dataVencimentoFatura
        : t.data;
      if (dataRelevante < hoje || dataRelevante > limite) continue;

      porGrupo.total = Utils.round2(porGrupo.total + t.valor);
      if (t.formaPagamento === 'creditoCartao') {
        porGrupo.cartoes = Utils.round2(porGrupo.cartoes + t.valor);
      } else if (t.emprestimoId) {
        porGrupo.emprestimos = Utils.round2(porGrupo.emprestimos + t.valor);
      } else if (t.recorrenciaId) {
        porGrupo.contasFixas = Utils.round2(porGrupo.contasFixas + t.valor);
      } else {
        porGrupo.outros = Utils.round2(porGrupo.outros + t.valor);
      }
    }
    return porGrupo;
  },

  /* ===================== PROJEÇÃO ===================== */

  calcularProjecao(transacoes, nMeses) {
    const inicio = Utils.currentCompetencia();
    const meses = [];
    for (let i = 0; i < nMeses; i++) {
      const competencia = Utils.addMonthsToCompetencia(inicio, i);
      const entradas = this.calcularReceitasMes(transacoes, competencia);
      const saidas = this.calcularDespesasMes(transacoes, competencia);
      const investimentos = this.calcularInvestimentosMes(transacoes, competencia);
      meses.push({
        competencia,
        entradas,
        saidas,
        investimentos,
        saldoMes: Utils.round2(entradas - saidas - investimentos)
      });
    }
    return meses;
  },

  /* ===================== PATRIMÔNIO ===================== */

  calcularPatrimonio(contas, transacoes, investimentos, loans) {
    const hoje = Utils.todayISO();
    const saldoContas = this.calcularSaldo(contas.filter((c) => c.ativa !== false), transacoes, null, hoje);

    const totalInvestido = investimentos.reduce((s, i) => s + (i.valorAtual != null ? i.valorAtual : i.valorInvestidoInicial || 0), 0);

    const aReceber = loans
      .filter((l) => l.direcao === 'concedido')
      .reduce((s, l) => s + this.saldoDevedorEmprestimo(l, transacoes), 0);

    const ativos = Utils.round2(saldoContas + totalInvestido + aReceber);

    const devedorRecebido = loans
      .filter((l) => l.direcao === 'recebido')
      .reduce((s, l) => s + this.saldoDevedorEmprestimo(l, transacoes), 0);

    const parcelamentosFuturos = transacoes
      .filter((t) => t.tipo === 'despesa' && t.formaPagamento === 'creditoCartao' && ['prevista', 'pendente'].includes(t.status))
      .reduce((s, t) => s + t.valor, 0);

    const passivos = Utils.round2(devedorRecebido + parcelamentosFuturos);

    return {
      ativos,
      passivos,
      liquido: Utils.round2(ativos - passivos),
      detalhe: { saldoContas, totalInvestido, aReceber, devedorRecebido, parcelamentosFuturos }
    };
  },

  /** Saldo devedor/restante de um empréstimo, a partir das parcelas já lançadas. */
  saldoDevedorEmprestimo(loan, transacoes) {
    const parcelas = transacoes.filter((t) => t.emprestimoId === loan.id && t.tipo !== 'transferencia' && !t.principal);
    const pagas = parcelas.filter((t) => ['paga', 'recebida'].includes(t.status)).reduce((s, t) => s + t.valor, 0);
    return Utils.round2((loan.valorTotal || 0) - pagas);
  },

  /* ===================== RECORRÊNCIA ===================== */

  /** Gera as datas (ISO) de ocorrência de uma recorrência até um horizonte. */
  gerarDatasRecorrencia(rec, horizonteISO) {
    const datas = [];
    let atual = Utils.isoToDate(rec.dataInicial);
    const limiteConfig = rec.dataFinal ? Utils.isoToDate(rec.dataFinal) : null;
    const limiteHorizonte = Utils.isoToDate(horizonteISO);
    const fim = limiteConfig && limiteConfig < limiteHorizonte ? limiteConfig : limiteHorizonte;

    let count = 0;
    const maxCount = rec.quantidadeOcorrencias || Infinity;

    while (atual <= fim && count < maxCount) {
      datas.push(Utils.dateToISO(atual));
      count++;
      if (rec.frequencia === 'semanal') atual = Utils.addDays(atual, 7);
      else if (rec.frequencia === 'anual') atual = Utils.addMonths(atual, 12);
      else if (rec.frequencia === 'personalizado') atual = Utils.addDays(atual, rec.intervaloDias || 30);
      else atual = Utils.addMonths(atual, 1);
    }
    return datas;
  }
};

/* ===== js/ui.js ===== */
/* ui.js — modal, toast, confirmação e pequeno barramento de eventos */

const Bus = {
  _listeners: {},
  on(event, fn) {
    (this._listeners[event] = this._listeners[event] || []).push(fn);
    return () => this.off(event, fn);
  },
  off(event, fn) {
    if (!this._listeners[event]) return;
    this._listeners[event] = this._listeners[event].filter((f) => f !== fn);
  },
  emit(event, payload) {
    (this._listeners[event] || []).forEach((fn) => fn(payload));
  }
};

const UI = {
  toast(message, type = 'info', duration = 3200) {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(() => el.remove(), duration);
  },

  openModal(title, contentEl, opts = {}) {
    const backdrop = document.getElementById('modalBackdrop');
    const box = document.getElementById('modalBox');
    const titleEl = document.getElementById('modalTitle');
    const body = document.getElementById('modalBody');

    titleEl.textContent = title;
    body.innerHTML = '';
    if (typeof contentEl === 'string') {
      body.innerHTML = contentEl;
    } else if (contentEl instanceof Node) {
      body.appendChild(contentEl);
    }
    box.classList.toggle('modal-wide', !!opts.wide);
    backdrop.classList.add('open');
    this._escHandler = (e) => { if (e.key === 'Escape') UI.closeModal(); };
    document.addEventListener('keydown', this._escHandler);
    return body;
  },

  closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
    document.getElementById('modalBody').innerHTML = '';
    if (this._escHandler) document.removeEventListener('keydown', this._escHandler);
  },

  confirm(message, opts = {}) {
    return new Promise((resolve) => {
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <p style="margin-top:0">${Utils.escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn btn-secondary" data-act="cancel">${opts.cancelLabel || 'Cancelar'}</button>
          <button class="btn ${opts.danger ? 'btn-danger' : ''}" data-act="ok">${opts.okLabel || 'Confirmar'}</button>
        </div>`;
      const body = this.openModal(opts.title || 'Confirmar ação', wrap);
      body.querySelector('[data-act="cancel"]').onclick = () => { this.closeModal(); resolve(false); };
      body.querySelector('[data-act="ok"]').onclick = () => { this.closeModal(); resolve(true); };
    });
  },

  choice(message, options, opts = {}) {
    return new Promise((resolve) => {
      const wrap = document.createElement('div');
      const btns = options.map((o, i) => `<button class="btn ${i === 0 ? '' : 'btn-secondary'} btn-block" style="margin-bottom:8px" data-idx="${i}">${Utils.escapeHtml(o.label)}</button>`).join('');
      wrap.innerHTML = `<p style="margin-top:0">${Utils.escapeHtml(message)}</p><div>${btns}</div>
        <div class="modal-actions"><button class="btn btn-ghost" data-act="cancel">Cancelar</button></div>`;
      const body = this.openModal(opts.title || 'Escolha uma opção', wrap);
      options.forEach((o, i) => {
        body.querySelector(`[data-idx="${i}"]`).onclick = () => { this.closeModal(); resolve(o.value); };
      });
      body.querySelector('[data-act="cancel"]').onclick = () => { this.closeModal(); resolve(null); };
    });
  },

  el(html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = html.trim();
    return tpl.content.firstChild;
  },

  optionsHtml(items, selectedValue, labelKey = 'nome', valueKey = 'id') {
    return items.map((it) => `<option value="${it[valueKey]}" ${it[valueKey] === selectedValue ? 'selected' : ''}>${Utils.escapeHtml(it[labelKey])}</option>`).join('');
  }
};

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('modalClose').onclick = () => UI.closeModal();
  document.getElementById('modalBackdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modalBackdrop') UI.closeModal();
  });
});


/* ===== js/charts.js ===== */
/* charts.js — wrapper fino sobre Chart.js, com cores consistentes ao tema */

const Charts = {
  _instances: {},

  palette: ['#0ea5e9', '#f97316', '#6366f1', '#ec4899', '#22c55e', '#ef4444', '#14b8a6', '#a855f7', '#eab308', '#64748b', '#7c3aed', '#94a3b8'],

  _themeColor() {
    return getComputedStyle(document.documentElement).getPropertyValue('--color-text').trim() || '#1e2733';
  },

  destroy(canvasId) {
    if (this._instances[canvasId]) {
      this._instances[canvasId].destroy();
      delete this._instances[canvasId];
    }
  },

  doughnut(canvasId, labels, data, colors) {
    this.destroy(canvasId);
    const ctx = document.getElementById(canvasId);
    if (!ctx || typeof Chart === 'undefined') return;
    this._instances[canvasId] = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors || this.palette, borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '65%',
        plugins: { legend: { position: 'bottom', labels: { color: this._themeColor(), boxWidth: 12, padding: 12, font: { size: 11 } } } }
      }
    });
  },

  bar(canvasId, labels, datasets, opts = {}) {
    this.destroy(canvasId);
    const ctx = document.getElementById(canvasId);
    if (!ctx || typeof Chart === 'undefined') return;
    const color = this._themeColor();
    this._instances[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { stacked: !!opts.stacked, ticks: { color }, grid: { display: false } },
          y: { stacked: !!opts.stacked, ticks: { color }, grid: { color: 'rgba(120,130,150,.15)' } }
        },
        plugins: { legend: { display: datasets.length > 1, labels: { color } } }
      }
    });
  },

  line(canvasId, labels, datasets) {
    this.destroy(canvasId);
    const ctx = document.getElementById(canvasId);
    if (!ctx || typeof Chart === 'undefined') return;
    const color = this._themeColor();
    this._instances[canvasId] = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets: datasets.map((d) => ({ tension: 0.35, fill: true, ...d })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { ticks: { color }, grid: { display: false } },
          y: { ticks: { color }, grid: { color: 'rgba(120,130,150,.15)' } }
        },
        plugins: { legend: { display: datasets.length > 1, labels: { color } } }
      }
    });
  }
};

      </div>

      <div class="form-group">
        <label>Cor</label>
        <div class="chip-row">${cores.map((c) => `<span class="swatch ${cartao?.cor === c ? 'selected' : ''}" style="background:${c}" data-cor="${c}"></span>`).join('')}</div>
      </div>
      ${cartao ? `<div class="form-group checkbox-row"><input type="checkbox" id="fAtivo" ${cartao.ativo !== false ? 'checked' : ''}><label style="margin:0">Cartão ativo</label></div>` : ''}

        <button class="btn" id="btnSave">Salvar</button>
      </div>

    body.querySelectorAll('.swatch').forEach((s) => {
      s.onclick = () => {
        body.querySelectorAll('.swatch').forEach((x) => x.classList.remove('selected'));
        s.classList.add('selected');

      };

    body.querySelector('#btnCancel').onclick = () => UI.closeModal();

    if (cartao) {
      body.querySelector('#btnDelete').onclick = async () => {
        const emUso = (await DB.getByIndex('transactions', 'cartaoId', cartao.id)).length > 0;
        if (emUso) {
          UI.toast('Este cartão possui compras vinculadas. Desative-o em vez de excluir.', 'error');
          return;
        }
        const ok = await UI.confirm('Excluir este cartão permanentemente?', { danger: true });
        if (!ok) return;
        await DB.delete('creditCards', cartao.id);
        UI.closeModal();
        UI.toast('Cartão excluído', 'success');
        Bus.emit('data:changed');
      };
    }

    body.querySelector('#btnSave').onclick = async () => {
      const nome = body.querySelector('#fNome').value.trim();
      const fechamento = parseInt(body.querySelector('#fFechamento').value, 10);
      const vencimento = parseInt(body.querySelector('#fVencimento').value, 10);
      if (!nome) { UI.toast('Informe o nome do cartão', 'error'); return; }
      if (!fechamento || fechamento < 1 || fechamento > 31) { UI.toast('Informe o dia de fechamento (1-31)', 'error'); return; }
      if (!vencimento || vencimento < 1 || vencimento > 31) { UI.toast('Informe o dia de vencimento (1-31)', 'error'); return; }

      const ativoEl = body.querySelector('#fAtivo');
      await DB.put('creditCards', {
        id: cartao?.id || Utils.uuid(),
        nome,
        banco: body.querySelector('#fBanco').value.trim(),
        bandeira: body.querySelector('#fBandeira').value,
        limite: parseFloat(body.querySelector('#fLimite').value) || 0,
        diaFechamento: fechamento,

        ultimosDigitos: body.querySelector('#fDigitos').value.trim(),
        cor: corSelecionada,
        ativo: ativoEl ? ativoEl.checked : true
      });
      UI.closeModal();
      UI.toast('Cartão salvo', 'success');
      Bus.emit('data:changed');
    };
  }
};


/* ===== js/invoices.js ===== */
/* invoices.js — faturas de cartão de crédito: agregação, status e pagamento */

const Invoices = {
  /** Garante que exista um registro de cabeçalho de fatura para o cartão/competência, com status coerente com a data atual. */
  async ensure(cartaoId, competencia, cartao) {
    const existentes = await DB.getByIndex('invoices', 'cartaoId', cartaoId);
    let invoice = existentes.find((i) => i.competencia === competencia);
    const { dataFechamento, dataVencimento } = Finance.datasDaFatura(competencia, cartao);
    const hoje = Utils.todayISO();
    const isoFechamento = Utils.dateToISO(dataFechamento);
    const isoVencimento = Utils.dateToISO(dataVencimento);

    if (!invoice) {
      invoice = {
        id: Utils.uuid(),
        cartaoId,
        competencia,
        dataFechamento: isoFechamento,
        dataVencimento: isoVencimento,
        status: hoje < isoFechamento ? 'aberta' : 'fechada',
        valorPago: 0,
        transacaoPagamentoId: null
      };
      await DB.put('invoices', invoice);
    } else if (invoice.status === 'aberta' && hoje >= isoFechamento) {
      invoice.status = 'fechada';
      await DB.put('invoices', invoice);
    }
    return invoice;
  },

  async getOrBuild(cartaoId, competencia, cartao) {
    return this.ensure(cartaoId, competencia, cartao);
  },

  itensDaFatura(transacoes, cartaoId, competencia) {
    return transacoes.filter((t) =>
      t.cartaoId === cartaoId &&
      t.faturaCompetencia === competencia &&
      t.tipo === 'despesa' &&
      t.status !== 'cancelada'
    ).sort((a, b) => a.data.localeCompare(b.data));
  },

  totalFatura(transacoes, cartaoId, competencia) {
    return Utils.round2(this.itensDaFatura(transacoes, cartaoId, competencia).reduce((s, t) => s + t.valor, 0));
  },

  competenciasComCompras(transacoes, cartaoId) {
    const set = new Set();
    transacoes.filter((t) => t.cartaoId === cartaoId && t.faturaCompetencia).forEach((t) => set.add(t.faturaCompetencia));
    return Array.from(set).sort();
  },

  async resumoCartao(cartaoId, transacoes) {
    const competencias = this.competenciasComCompras(transacoes, cartaoId);
    const atual = Utils.currentCompetencia();

    const invoicesDb = await DB.getByIndex('invoices', 'cartaoId', cartaoId);
    const pagas = new Set(invoicesDb.filter((i) => i.status === 'paga').map((i) => i.competencia));

    const abertas = competencias.filter((c) => !pagas.has(c)).sort();
    const faturaAtualComp = abertas.find((c) => c <= atual) || abertas[0] || null;
    const proximaComp = abertas.find((c) => c > (faturaAtualComp || '')) || null;

    const totalFaturaAtual = faturaAtualComp ? this.totalFatura(transacoes, cartaoId, faturaAtualComp) : 0;
    const totalProximaFatura = proximaComp ? this.totalFatura(transacoes, cartaoId, proximaComp) : 0;

    const totalComprometido = abertas.reduce((s, c) => s + this.totalFatura(transacoes, cartaoId, c), 0);
    const totalFuturo = Utils.round2(totalComprometido - totalFaturaAtual);

    return {
      faturaAtual: faturaAtualComp ? { competencia: faturaAtualComp } : null,
      totalFaturaAtual,
      proximaFatura: proximaComp ? { competencia: proximaComp } : null,
      totalProximaFatura,
      totalComprometido: Utils.round2(totalComprometido),
      totalFuturo
    };
  },

  async marcarComoPaga(invoice, contaId, dataPagamento) {
    const transacoes = await DB.getAll('transactions');
    const total = this.totalFatura(transacoes, invoice.cartaoId, invoice.competencia);

    const pagamento = {
      id: Utils.uuid(),
      tipo: 'pagamentoFatura',
      descricao: `Pagamento fatura ${Utils.competenciaLabel(invoice.competencia)}`,
      valor: total,
      data: dataPagamento,
      contaId,
      cartaoId: invoice.cartaoId,
      faturaPagaId: invoice.id,
      formaPagamento: 'transferencia',
      status: 'paga',
      criadoEm: new Date().toISOString()
    };
    await DB.put('transactions', pagamento);

    const itens = this.itensDaFatura(transacoes, invoice.cartaoId, invoice.competencia);
    for (const item of itens) item.status = 'paga';
    if (itens.length) await DB.bulkPut('transactions', itens);

    invoice.status = 'paga';
    invoice.valorPago = total;
    invoice.transacaoPagamentoId = pagamento.id;
    await DB.put('invoices', invoice);
  },

  async reabrir(invoice) {
    if (invoice.transacaoPagamentoId) {
      await DB.delete('transactions', invoice.transacaoPagamentoId);
    }
    const transacoes = await DB.getAll('transactions');
    const itens = this.itensDaFatura(transacoes, invoice.cartaoId, invoice.competencia).filter((t) => t.status === 'paga');
    for (const item of itens) item.status = 'pendente';
    if (itens.length) await DB.bulkPut('transactions', itens);

    invoice.status = Utils.todayISO() >= invoice.dataFechamento ? 'fechada' : 'aberta';
    invoice.valorPago = 0;
    invoice.transacaoPagamentoId = null;
    await DB.put('invoices', invoice);
  }
};

/* ===== js/recurring.js ===== */
/* recurring.js — salário, receitas recorrentes e contas fixas */

const HORIZONTE_MESES = 24;

const Recurring = {
  horizonteISO() {
    return Utils.dateToISO(Utils.addMonths(new Date(), HORIZONTE_MESES));
  },

  /** Gera (materializa) as transações futuras de uma recorrência que ainda não existem. */
  async materializar(rec) {
    const datas = Finance.gerarDatasRecorrencia(rec, this.horizonteISO());
    const existentes = await DB.getByIndex('transactions', 'recorrenciaId', rec.id);
    const datasExistentes = new Set(existentes.map((t) => t.data));

    const novas = datas.filter((d) => !datasExistentes.has(d)).map((data) => ({
      id: Utils.uuid(),
      tipo: rec.tipo,
      descricao: rec.descricao,
      valor: rec.valor,
      data,
      categoriaId: rec.categoriaId,
      subcategoriaId: rec.subcategoriaId,
      formaPagamento: rec.tipo === 'receita' ? 'transferencia' : (rec.formaPagamento || 'transferencia'),
      contaId: rec.contaId,
      status: 'prevista',
      recorrenciaId: rec.id,
      gerado: true,
      criadoEm: new Date().toISOString()
    }));

    if (novas.length) await DB.bulkPut('transactions', novas);

    // remove ocorrências futuras que ficaram além do novo range (ex: dataFinal reduzida)
    const validas = new Set(datas);
    const obsoletas = existentes.filter((t) => t.data >= Utils.todayISO() && t.status === 'prevista' && !validas.has(t.data));
    if (obsoletas.length) await DB.bulkDelete('transactions', obsoletas.map((t) => t.id));

    return novas.length;
  },

  async atualizarFuturas(rec, apartirDeISO) {
    const existentes = await DB.getByIndex('transactions', 'recorrenciaId', rec.id);
    const alvo = existentes.filter((t) => t.status === 'prevista' && t.data >= apartirDeISO);
    for (const t of alvo) {
      t.descricao = rec.descricao;
      t.valor = rec.valor;
      t.categoriaId = rec.categoriaId;
      t.subcategoriaId = rec.subcategoriaId;
      t.contaId = rec.contaId;
      if (rec.tipo === 'despesa') t.formaPagamento = rec.formaPagamento || 'transferencia';
    }
    if (alvo.length) await DB.bulkPut('transactions', alvo);
  },

  async excluir(rec, escopo) {
    const existentes = await DB.getByIndex('transactions', 'recorrenciaId', rec.id);
    if (escopo === 'todas') {
      await DB.bulkDelete('transactions', existentes.map((t) => t.id));
    } else {
      const futurasNaoPagas = existentes.filter((t) => ['prevista', 'pendente'].includes(t.status));
      await DB.bulkDelete('transactions', futurasNaoPagas.map((t) => t.id));
      const passadas = existentes.filter((t) => ['paga', 'recebida'].includes(t.status));
      for (const t of passadas) t.recorrenciaId = null;
      if (passadas.length) await DB.bulkPut('transactions', passadas);
    }
    await DB.delete('recurringTransactions', rec.id);
  },

  async materializarTodas() {
    const recs = await DB.getAll('recurringTransactions');
    for (const rec of recs.filter((r) => r.ativo !== false)) {
      await this.materializar(rec);
    }
  }
};
