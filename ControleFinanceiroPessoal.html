      }).join('');

      listEl.querySelectorAll('.list-item').forEach((it) => {
        it.onclick = () => this.openForm(recs.find((r) => r.id === it.dataset.id));
      });
    }

    container.querySelector('#btnNew').onclick = () => this.openForm();
  },

  async openForm(rec) {
    const tipo = rec?.tipo || this.activeTab;
    const contas = await DB.getAll('accounts');
    const categorias = await DB.getAll('categories');
    const subcats = await DB.getAll('subcategories');

    if (contas.length === 0) { UI.toast('Cadastre uma conta primeiro', 'error'); return; }

    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="form-group"><label>Descrição *</label><input type="text" id="fDesc" value="${Utils.escapeHtml(rec?.descricao || '')}" placeholder="${tipo === 'receita' ? 'Ex: Salário' : 'Ex: Aluguel, Internet'}"></div>
      <div class="form-row">
        <div class="form-group"><label>Valor (R$) *</label><input type="number" step="0.01" id="fValor" value="${rec?.valor ?? ''}"></div>
        <div class="form-group"><label>${tipo === 'receita' ? 'Conta de destino' : 'Conta de pagamento'} *</label><select id="fConta">${UI.optionsHtml(contas, rec?.contaId)}</select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Categoria</label><select id="fCategoria">${UI.optionsHtml(categorias, rec?.categoriaId)}</select></div>
        <div class="form-group"><label>Subcategoria</label><select id="fSubcategoria"></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Frequência</label>
          <select id="fFrequencia">
            ${[['mensal', 'Mensal'], ['semanal', 'Semanal'], ['anual', 'Anual'], ['personalizado', 'Personalizado']].map(([v, l]) => `<option value="${v}" ${rec?.frequencia === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="form-group" id="grpIntervalo" style="display:${rec?.frequencia === 'personalizado' ? 'block' : 'none'}">
          <label>Intervalo (dias)</label><input type="number" min="1" id="fIntervalo" value="${rec?.intervaloDias ?? 30}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>${tipo === 'receita' ? 'Dia do recebimento' : 'Dia de vencimento'} (data inicial) *</label><input type="date" id="fDataInicial" value="${rec?.dataInicial || Utils.todayISO()}"></div>
        <div class="form-group"><label>Data final (opcional)</label><input type="date" id="fDataFinal" value="${rec?.dataFinal || ''}"></div>
      </div>
      <div class="form-group"><label>Quantidade de ocorrências (opcional)</label><input type="number" min="1" id="fQtdOcorrencias" value="${rec?.quantidadeOcorrencias || ''}"></div>
      ${rec ? `<div class="form-group checkbox-row"><input type="checkbox" id="fAtivo" ${rec.ativo !== false ? 'checked' : ''}><label style="margin:0">Recorrência ativa</label></div>` : ''}
      <div class="modal-actions">
        ${rec ? '<button class="btn btn-danger" id="btnDelete" style="margin-right:auto">Excluir</button>' : ''}
        <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
        <button class="btn" id="btnSave">Salvar</button>
      </div>
    `;

    const body = UI.openModal(rec ? 'Editar recorrência' : (tipo === 'receita' ? 'Nova receita recorrente' : 'Nova conta fixa'), wrap);

    const fillSub = () => {
      const catId = body.querySelector('#fCategoria').value;
      const opts = subcats.filter((s) => s.categoriaId === catId);
      body.querySelector('#fSubcategoria').innerHTML = UI.optionsHtml(opts, rec?.subcategoriaId);
    };
    fillSub();
    body.querySelector('#fCategoria').onchange = fillSub;
    body.querySelector('#fFrequencia').onchange = (e) => {
      body.querySelector('#grpIntervalo').style.display = e.target.value === 'personalizado' ? 'block' : 'none';
    };
    body.querySelector('#btnCancel').onclick = () => UI.closeModal();

    if (rec) {
      body.querySelector('#btnDelete').onclick = async () => {
        const escopo = await UI.choice('Excluir esta recorrência:', [
          { label: 'Somente ocorrências futuras não pagas', value: 'futuras' },
          { label: 'Todas as ocorrências (inclusive histórico)', value: 'todas' }
        ]);
        if (!escopo) return;
        await Recurring.excluir(rec, escopo);
        UI.closeModal();
        UI.toast('Recorrência excluída', 'success');
        Bus.emit('data:changed');
      };
    }

    body.querySelector('#btnSave').onclick = async () => {
      const descricao = body.querySelector('#fDesc').value.trim();
      const valor = parseFloat(body.querySelector('#fValor').value);
      const dataInicial = body.querySelector('#fDataInicial').value;
      if (!descricao) { UI.toast('Informe a descrição', 'error'); return; }
      if (!valor || valor <= 0) { UI.toast('Informe um valor válido', 'error'); return; }
      if (!dataInicial) { UI.toast('Informe a data inicial', 'error'); return; }

      const ativoEl = body.querySelector('#fAtivo');
      const registro = {
        id: rec?.id || Utils.uuid(),
        tipo,
        descricao,
        valor,
        contaId: body.querySelector('#fConta').value,
        categoriaId: body.querySelector('#fCategoria').value || null,
        subcategoriaId: body.querySelector('#fSubcategoria').value || null,
        formaPagamento: tipo === 'despesa' ? 'debito' : 'transferencia',
        frequencia: body.querySelector('#fFrequencia').value,
        intervaloDias: parseInt(body.querySelector('#fIntervalo')?.value, 10) || 30,
        dataInicial,
        dataFinal: body.querySelector('#fDataFinal').value || null,
        quantidadeOcorrencias: parseInt(body.querySelector('#fQtdOcorrencias').value, 10) || null,
        ativo: ativoEl ? ativoEl.checked : true
      };

      const isEdit = !!rec;
      let escopo = 'todas';
      if (isEdit) {
        escopo = await UI.choice('Aplicar alterações a:', [
          { label: 'Somente próximas ocorrências não pagas', value: 'futuras' },
          { label: 'Toda a série (recria pendentes)', value: 'todas' }
        ]) || 'futuras';
      }

      await DB.put('recurringTransactions', registro);
      if (registro.ativo) {
        await Recurring.materializar(registro);
        if (isEdit) await Recurring.atualizarFuturas(registro, escopo === 'todas' ? '0000-00-00' : Utils.todayISO());
      }
      UI.closeModal();
      UI.toast('Recorrência salva', 'success');
      Bus.emit('data:changed');
    };
  }
};


/* ===== js/transactions.js ===== */
/* transactions.js — CRUD de movimentações (receitas e despesas), incluindo compra no cartão */

const TIPO_LABEL = { receita: 'Receita', despesa: 'Despesa', transferencia: 'Transferência', investimento: 'Investimento', pagamentoFatura: 'Pagamento de fatura' };
const FORMA_LABEL = { dinheiro: 'Dinheiro', pix: 'PIX', debito: 'Débito', creditoCartao: 'Cartão de crédito', transferencia: 'Transferência', outro: 'Outro' };
const STATUS_LABEL = { prevista: 'Prevista', pendente: 'Pendente', paga: 'Paga', recebida: 'Recebida', cancelada: 'Cancelada' };
const STATUS_BADGE = { prevista: 'badge-info', pendente: 'badge-card', paga: 'badge-income', recebida: 'badge-income', cancelada: 'badge-neutral' };

const TransactionsView = {
  filters: { inicio: null, fim: null, categoriaId: '', tipo: '', formaPagamento: '', contaId: '', cartaoId: '', status: '', valorMin: '', valorMax: '', texto: '' },

  async render(container, params = {}) {
    if (params.reset) this.resetFilters();
    const [transacoes, categorias, subcategorias, contas, cartoes] = await Promise.all([
      DB.getAll('transactions'), DB.getAll('categories'), DB.getAll('subcategories'), DB.getAll('accounts'), DB.getAll('creditCards')
    ]);
    const mapaCategorias = Object.fromEntries(categorias.map((c) => [c.id, c]));
    const mapaContas = Object.fromEntries(contas.map((c) => [c.id, c]));
    const mapaCartoes = Object.fromEntries(cartoes.map((c) => [c.id, c]));

    container.innerHTML = `
      <div class="section-header">
        <h2>Movimentações</h2>
        <div style="display:flex; gap:8px">
          <button class="btn btn-secondary" id="btnClearFilters">Limpar filtros</button>
          <button class="btn" id="btnNewExpense">+ Nova movimentação</button>
        </div>
      </div>
      <div class="card filters-bar">
        <div class="form-group"><label>De</label><input type="date" id="fInicio" value="${this.filters.inicio || ''}"></div>
        <div class="form-group"><label>Até</label><input type="date" id="fFim" value="${this.filters.fim || ''}"></div>
        <div class="form-group"><label>Tipo</label>
          <select id="fTipo"><option value="">Todos</option>${Object.entries(TIPO_LABEL).map(([v, l]) => `<option value="${v}" ${this.filters.tipo === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Categoria</label>
          <select id="fCategoria"><option value="">Todas</option>${UI.optionsHtml(categorias, this.filters.categoriaId)}</select>
        </div>
        <div class="form-group"><label>Forma de pagamento</label>
          <select id="fForma"><option value="">Todas</option>${Object.entries(FORMA_LABEL).map(([v, l]) => `<option value="${v}" ${this.filters.formaPagamento === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Conta</label>
          <select id="fConta"><option value="">Todas</option>${UI.optionsHtml(contas, this.filters.contaId)}</select>
        </div>
        <div class="form-group"><label>Cartão</label>
          <select id="fCartao"><option value="">Todos</option>${UI.optionsHtml(cartoes, this.filters.cartaoId)}</select>
        </div>
        <div class="form-group"><label>Status</label>
          <select id="fStatus"><option value="">Todos</option>${Object.entries(STATUS_LABEL).map(([v, l]) => `<option value="${v}" ${this.filters.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Valor mín.</label><input type="number" step="0.01" id="fValorMin" value="${this.filters.valorMin}"></div>
        <div class="form-group"><label>Valor máx.</label><input type="number" step="0.01" id="fValorMax" value="${this.filters.valorMax}"></div>
        <div class="form-group" style="flex:2; min-width:200px"><label>Buscar</label><input type="text" id="fTexto" placeholder="Descrição…" value="${Utils.escapeHtml(this.filters.texto)}"></div>
      </div>
      <div class="table-wrap" style="margin-top:16px">
        <table class="data-table">
          <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Origem</th><th>Status</th><th style="text-align:right">Valor</th><th></th></tr></thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
      <div id="txEmpty" style="display:none" class="empty-state"><span class="emoji">💸</span>Nenhuma movimentação encontrada com os filtros atuais.</div>
    `;

    const bindFilterInputs = () => {
      container.querySelector('#fInicio').onchange = (e) => { this.filters.inicio = e.target.value || null; this.render(container); };
      container.querySelector('#fFim').onchange = (e) => { this.filters.fim = e.target.value || null; this.render(container); };
      container.querySelector('#fTipo').onchange = (e) => { this.filters.tipo = e.target.value; this.render(container); };
      container.querySelector('#fCategoria').onchange = (e) => { this.filters.categoriaId = e.target.value; this.render(container); };
      container.querySelector('#fForma').onchange = (e) => { this.filters.formaPagamento = e.target.value; this.render(container); };
      container.querySelector('#fConta').onchange = (e) => { this.filters.contaId = e.target.value; this.render(container); };
      container.querySelector('#fCartao').onchange = (e) => { this.filters.cartaoId = e.target.value; this.render(container); };
      container.querySelector('#fStatus').onchange = (e) => { this.filters.status = e.target.value; this.render(container); };
      container.querySelector('#fValorMin').oninput = Utils.debounce((e) => { this.filters.valorMin = e.target.value; this.render(container); }, 400);
      container.querySelector('#fValorMax').oninput = Utils.debounce((e) => { this.filters.valorMax = e.target.value; this.render(container); }, 400);
      container.querySelector('#fTexto').oninput = Utils.debounce((e) => { this.filters.texto = e.target.value; this.render(container); }, 300);
    };
    bindFilterInputs();

    container.querySelector('#btnClearFilters').onclick = () => this.render(container, { reset: true });
    container.querySelector('#btnNewExpense').onclick = () => this.openForm('despesa');

    const filtrados = transacoes.filter((t) => {
      if (this.filters.inicio && t.data < this.filters.inicio) return false;
      if (this.filters.fim && t.data > this.filters.fim) return false;
      if (this.filters.tipo && t.tipo !== this.filters.tipo) return false;
      if (this.filters.categoriaId && t.categoriaId !== this.filters.categoriaId) return false;
      if (this.filters.formaPagamento && t.formaPagamento !== this.filters.formaPagamento) return false;
      if (this.filters.contaId && t.contaId !== this.filters.contaId && t.contaDestinoId !== this.filters.contaId) return false;
      if (this.filters.cartaoId && t.cartaoId !== this.filters.cartaoId) return false;
      if (this.filters.status && t.status !== this.filters.status) return false;
      if (this.filters.valorMin && t.valor < parseFloat(this.filters.valorMin)) return false;
      if (this.filters.valorMax && t.valor > parseFloat(this.filters.valorMax)) return false;
      if (this.filters.texto && !t.descricao.toLowerCase().includes(this.filters.texto.toLowerCase())) return false;
      return true;
    }).sort((a, b) => b.data.localeCompare(a.data) || (b.criadoEm || '').localeCompare(a.criadoEm || ''));

    const tbody = container.querySelector('#txBody');
    container.querySelector('#txEmpty').style.display = filtrados.length ? 'none' : 'block';

    tbody.innerHTML = filtrados.slice(0, 300).map((t) => {
      const cat = mapaCategorias[t.categoriaId];
      const origem = t.cartaoId ? `💳 ${Utils.escapeHtml(mapaCartoes[t.cartaoId]?.nome || '')}` : (mapaContas[t.contaId] ? `🏦 ${Utils.escapeHtml(mapaContas[t.contaId].nome)}` : '—');
      const sinalClasse = t.tipo === 'receita' ? 'text-income' : (t.tipo === 'despesa' || t.tipo === 'pagamentoFatura' ? 'text-expense' : (t.tipo === 'investimento' ? 'text-invest' : ''));
      const sinal = t.tipo === 'receita' ? '+ ' : (t.tipo === 'despesa' || t.tipo === 'pagamentoFatura' || t.tipo === 'investimento' ? '- ' : '');
      const parcelaTxt = t.parcelaTotal > 1 ? ` (${t.parcelaNumero}/${t.parcelaTotal})` : '';
      return `
        <tr data-id="${t.id}">
          <td>${Utils.formatDateBR(t.data)}</td>
          <td>${Utils.escapeHtml(t.descricao)}${parcelaTxt}</td>
          <td>${cat ? `<span class="chip" style="background:${cat.cor}22;color:${cat.cor}">${Utils.escapeHtml(cat.nome)}</span>` : '—'}</td>
          <td class="text-muted">${origem}</td>
          <td><span class="badge ${STATUS_BADGE[t.status] || 'badge-neutral'}">${STATUS_LABEL[t.status] || t.status}</span></td>
          <td style="text-align:right" class="${sinalClasse}">${sinal}${Utils.formatCurrency(t.valor)}</td>
          <td style="text-align:right; white-space:nowrap">
            ${['prevista', 'pendente'].includes(t.status) && !t.cartaoId ? `<button class="icon-btn btn-quick-pay" title="Marcar como ${t.tipo === 'receita' ? 'recebida' : 'paga'}">✔️</button>` : ''}
            <button class="icon-btn btn-row-menu" title="Mais">⋮</button>
          </td>
        </tr>`;
    }).join('');

    tbody.querySelectorAll('tr').forEach((row) => {
      const t = filtrados.find((x) => x.id === row.dataset.id);
      row.querySelector('td:nth-child(2)').onclick = () => this.openEditDispatcher(t);
      const payBtn = row.querySelector('.btn-quick-pay');
      if (payBtn) payBtn.onclick = async (e) => {
        e.stopPropagation();
        t.status = t.tipo === 'receita' ? 'recebida' : 'paga';
        await DB.put('transactions', t);
        UI.toast('Status atualizado', 'success');
        Bus.emit('data:changed');
      };
      row.querySelector('.btn-row-menu').onclick = (e) => { e.stopPropagation(); this.openRowMenu(t); };
    });
  },

  resetFilters() {
    this.filters = { inicio: null, fim: null, categoriaId: '', tipo: '', formaPagamento: '', contaId: '', cartaoId: '', status: '', valorMin: '', valorMax: '', texto: '' };
  },

  openEditDispatcher(t) {
    if (t.tipo === 'transferencia' || t.tipo === 'pagamentoFatura') {
      UI.toast('Este tipo de lançamento é gerenciado em sua própria tela (Contas / Faturas).', 'info');
      return;
    }
    if (t.tipo === 'investimento') { Investments.openAporteForm(null, t); return; }
    this.openForm(t.tipo, t);
  },

  async openRowMenu(t) {
    const simples = t.tipo === 'transferencia' || t.tipo === 'pagamentoFatura';
    const opcoes = [{ label: 'Editar', value: 'editar' }];
    if (!simples) opcoes.push({ label: 'Duplicar', value: 'duplicar' });
    if (!simples && t.status !== 'cancelada') opcoes.push({ label: 'Cancelar lançamento', value: 'cancelar' });
    opcoes.push({ label: 'Excluir', value: 'excluir' });
    const acao = await UI.choice(t.descricao, opcoes);
    if (!acao) return;

    if (acao === 'editar') return this.openEditDispatcher(t);
    if (acao === 'duplicar') return this.duplicar(t);
    if (acao === 'cancelar') return this.cancelar(t);
    if (acao === 'excluir') return this.excluir(t);
  },

  async duplicar(t) {
    const novaData = Utils.todayISO();
    const copia = { ...t, id: Utils.uuid(), data: novaData, status: 'prevista', compraId: null, parcelaNumero: null, parcelaTotal: null, recorrenciaId: null, criadoEm: new Date().toISOString() };

    if (t.formaPagamento === 'creditoCartao' && t.cartaoId) {
      const cartao = await DB.get('creditCards', t.cartaoId);
      if (cartao) {
        const { competencia, dataVencimento } = Finance.calcularFaturaCartao(Utils.isoToDate(novaData), cartao);
        copia.faturaCompetencia = competencia;
        copia.dataVencimentoFatura = Utils.dateToISO(dataVencimento);
        copia.status = 'pendente';
        await Invoices.ensure(cartao.id, competencia, cartao);
      }
    }

    await DB.put('transactions', copia);
    UI.toast('Lançamento duplicado', 'success');
    Bus.emit('data:changed');
  },

  async cancelar(t) {
    const ok = await UI.confirm('Cancelar este lançamento? Ele deixará de ser contabilizado.');
    if (!ok) return;
    t.status = 'cancelada';
    await DB.put('transactions', t);
    UI.toast('Lançamento cancelado', 'success');
    Bus.emit('data:changed');
  },

  async excluir(t) {
    if (t.parcelaTotal > 1) {
      const escopo = await UI.choice('Esta é uma compra parcelada. Deseja excluir:', [
        { label: 'Somente esta parcela', value: 'esta' },
        { label: 'Esta e as próximas parcelas', value: 'proximas' },
        { label: 'Todas as parcelas desta compra', value: 'todas' }
      ]);
      if (!escopo) return;
      const todas = await DB.getByIndex('transactions', 'compraId', t.compraId);
      let alvo = [t];
      if (escopo === 'proximas') alvo = todas.filter((x) => x.parcelaNumero >= t.parcelaNumero);
      if (escopo === 'todas') alvo = todas;
      await DB.bulkDelete('transactions', alvo.map((x) => x.id));
    } else {
      const ok = await UI.confirm('Excluir este lançamento permanentemente?', { danger: true });
      if (!ok) return;
      await DB.delete('transactions', t.id);
    }
    UI.toast('Lançamento excluído', 'success');
    Bus.emit('data:changed');
  },

  async openForm(tipo, rec, preset = {}) {
    const [contas, cartoes, categorias, subcategorias] = await Promise.all([
      DB.getAll('accounts'), DB.getAll('creditCards'), DB.getAll('categories'), DB.getAll('subcategories')
    ]);
    if (contas.length === 0) { UI.toast('Cadastre uma conta antes de lançar movimentações.', 'error'); return; }

    const isEdit = !!rec;
    const isParcelaExistente = rec?.parcelaTotal > 1;
    const formaInicial = rec?.formaPagamento || preset.formaPagamento || 'pix';
    const categoriasFiltradas = categorias.filter((c) => c.tipo === tipo || c.tipo === 'ambos');

    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="form-group"><label>Descrição *</label><input type="text" id="fDesc" value="${Utils.escapeHtml(rec?.descricao || '')}"></div>
      <div class="form-row">
        <div class="form-group"><label>Valor (R$) *</label><input type="number" step="0.01" min="0.01" id="fValor" value="${rec?.valor ?? ''}" ${isParcelaExistente ? 'disabled title="Edite o valor pela compra original"' : ''}></div>
        <div class="form-group"><label>Data *</label><input type="date" id="fData" value="${rec?.data || Utils.todayISO()}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Categoria</label><select id="fCategoria">${UI.optionsHtml(categoriasFiltradas, rec?.categoriaId)}</select></div>
        <div class="form-group"><label>Subcategoria</label><select id="fSubcategoria"></select></div>
      </div>
      ${tipo === 'despesa' ? `
      <div class="form-group">
        <label>Forma de pagamento</label>
        <select id="fForma" ${isParcelaExistente ? 'disabled' : ''}>${Object.entries(FORMA_LABEL).map(([v, l]) => `<option value="${v}" ${formaInicial === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      </div>
      <div id="grpConta" class="form-group"><label>Conta</label><select id="fConta">${UI.optionsHtml(contas, rec?.contaId)}</select></div>
      <div id="grpCartao" style="display:none">
        <div class="form-row">
          <div class="form-group"><label>Cartão *</label><select id="fCartaoSel">${UI.optionsHtml(cartoes, rec?.cartaoId)}</select></div>
          <div class="form-group"><label>Parcelas</label><input type="number" min="1" max="48" id="fParcelas" value="${rec?.parcelaTotal || 1}" ${isParcelaExistente ? 'disabled' : ''}></div>
        </div>
        <div class="field-hint" id="previewParcelas"></div>
      </div>
      ` : `
      <div class="form-group"><label>Conta de destino</label><select id="fConta">${UI.optionsHtml(contas, rec?.contaId)}</select></div>
      `}
      <div class="form-group" id="grpStatus"><label>Status</label>
        <select id="fStatus">
          ${(tipo === 'receita' ? ['prevista', 'recebida', 'cancelada'] : ['prevista', 'pendente', 'paga', 'cancelada']).map((s) => `<option value="${s}" ${(rec?.status || (tipo === 'receita' ? 'recebida' : 'paga')) === s ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
        </select>
        ${tipo === 'despesa' ? '<div class="field-hint" id="hintStatusCartao" style="display:none">Compras no cartão ficam pendentes até o pagamento da fatura.</div>' : ''}
      </div>
      <div class="form-group"><label>Observação</label><textarea id="fObs">${Utils.escapeHtml(rec?.observacao || '')}</textarea></div>
      ${!isEdit ? `
      <fieldset>
        <legend>Recorrência</legend>
        <div class="segmented" id="segRecorrencia">
          <button type="button" class="active" data-v="nao">Não se repete</button>
          <button type="button" data-v="sim">Recorrente</button>
        </div>
        <div id="grpRecorrencia" style="display:none; margin-top:12px">
          <div class="form-row">
            <div class="form-group"><label>Frequência</label>
              <select id="fFrequencia">
                <option value="mensal">Mensal</option><option value="semanal">Semanal</option><option value="anual">Anual</option><option value="personalizado">Personalizado</option>
              </select>
            </div>
            <div class="form-group"><label>Data final (opcional)</label><input type="date" id="fDataFinalRec"></div>
          </div>
        </div>
      </fieldset>` : ''}
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
        <button class="btn" id="btnSave">Salvar</button>
      </div>
    `;

    const body = UI.openModal(isEdit ? `Editar ${TIPO_LABEL[tipo].toLowerCase()}` : `Nova ${TIPO_LABEL[tipo].toLowerCase()}`, wrap);

    const fillSub = () => {
      const catId = body.querySelector('#fCategoria').value;
      const opts = subcategorias.filter((s) => s.categoriaId === catId);
      body.querySelector('#fSubcategoria').innerHTML = UI.optionsHtml(opts, rec?.subcategoriaId);
    };
    fillSub();
    body.querySelector('#fCategoria').onchange = fillSub;

    if (tipo === 'despesa') {
      const formaSel = body.querySelector('#fForma');
      const grpConta = body.querySelector('#grpConta');
      const grpCartao = body.querySelector('#grpCartao');
      const parcelasInput = body.querySelector('#fParcelas');

      const atualizarPreview = () => {
        const valor = parseFloat(body.querySelector('#fValor').value) || 0;
        const n = parseInt(parcelasInput.value, 10) || 1;
        const cartaoId = body.querySelector('#fCartaoSel').value;
        const cartao = cartoes.find((c) => c.id === cartaoId);
        const previewEl = body.querySelector('#previewParcelas');
        if (!cartao || !valor) { previewEl.textContent = ''; return; }
        const dataCompra = Utils.isoToDate(body.querySelector('#fData').value || Utils.todayISO());
        const parcelas = Finance.calcularParcelas({ dataCompra, valorTotal: valor, numeroParcelas: n, cartao });
        if (n === 1) {
          previewEl.textContent = `Entra na fatura de ${Utils.competenciaLabel(parcelas[0].competencia)}, vencimento ${Utils.formatDateBR(parcelas[0].dataVencimento)}.`;
        } else {
          previewEl.textContent = `${n}x de ${Utils.formatCurrency(parcelas[0].valor)} · 1ª fatura: ${Utils.competenciaLabel(parcelas[0].competencia)} · última: ${Utils.competenciaLabel(parcelas[n - 1].competencia)}.`;
        }
      };

      const grpStatus = body.querySelector('#grpStatus');
      const hintStatusCartao = body.querySelector('#hintStatusCartao');
      const toggleForma = () => {
        const isCartao = formaSel.value === 'creditoCartao';
        grpConta.style.display = isCartao ? 'none' : 'block';
        grpCartao.style.display = isCartao ? 'block' : 'none';
        grpStatus.style.display = isCartao && !isEdit ? 'none' : 'block';
        if (hintStatusCartao) hintStatusCartao.style.display = isCartao ? 'block' : 'none';
        if (isCartao) atualizarPreview();
      };
      formaSel.onchange = toggleForma;
      toggleForma();
      ['fValor', 'fData'].forEach((id) => body.querySelector('#' + id).addEventListener('input', atualizarPreview));
      parcelasInput.addEventListener('input', atualizarPreview);
      body.querySelector('#fCartaoSel').addEventListener('change', atualizarPreview);
    }

    if (!isEdit) {
      const segButtons = body.querySelectorAll('#segRecorrencia button');
      segButtons.forEach((b) => b.onclick = () => {
        segButtons.forEach((x) => x.classList.remove('active'));
        b.classList.add('active');
        body.querySelector('#grpRecorrencia').style.display = b.dataset.v === 'sim' ? 'block' : 'none';
      });
    }

    body.querySelector('#btnCancel').onclick = () => UI.closeModal();

    body.querySelector('#btnSave').onclick = async () => {
      const descricao = body.querySelector('#fDesc').value.trim();
      const valor = parseFloat(body.querySelector('#fValor').value);
      const data = body.querySelector('#fData').value;
      if (!descricao) { UI.toast('Informe a descrição', 'error'); return; }
      if (!valor || valor <= 0) { UI.toast('Informe um valor válido', 'error'); return; }
      if (!data) { UI.toast('Informe a data', 'error'); return; }

      const base = {
        tipo,
        descricao,
        data,
        categoriaId: body.querySelector('#fCategoria').value || null,
        subcategoriaId: body.querySelector('#fSubcategoria').value || null,
        status: body.querySelector('#fStatus').value,
        observacao: body.querySelector('#fObs').value.trim(),
        criadoEm: rec?.criadoEm || new Date().toISOString(),
        atualizadoEm: new Date().toISOString()
      };

      const isRecorrente = !isEdit && body.querySelector('#segRecorrencia .active')?.dataset.v === 'sim';

      if (tipo === 'despesa' && body.querySelector('#fForma').value === 'creditoCartao') {
        const cartaoId = body.querySelector('#fCartaoSel').value;
        const cartao = cartoes.find((c) => c.id === cartaoId);
        const numeroParcelas = parseInt(body.querySelector('#fParcelas').value, 10) || 1;
        if (!cartao) { UI.toast('Selecione o cartão', 'error'); return; }
        if (numeroParcelas < 1) { UI.toast('Número de parcelas inválido', 'error'); return; }

        if (isEdit) {
          const { competencia, dataVencimento } = Finance.calcularFaturaCartao(Utils.isoToDate(data), cartao);
          Object.assign(rec, base, {
            valor,
            formaPagamento: 'creditoCartao',
            cartaoId,
            faturaCompetencia: competencia,
            dataVencimentoFatura: Utils.dateToISO(dataVencimento)
          });
          await DB.put('transactions', rec);
          await Invoices.ensure(cartaoId, competencia, cartao);
        } else {
          const compraId = Utils.uuid();
          const parcelas = Finance.calcularParcelas({ dataCompra: Utils.isoToDate(data), valorTotal: valor, numeroParcelas, cartao });
          const registros = parcelas.map((p) => ({
            id: Utils.uuid(),
            ...base,
            descricao,
            valor: p.valor,
            formaPagamento: 'creditoCartao',
            cartaoId,
            compraId,
            parcelaNumero: p.numero,
            parcelaTotal: p.total,
            faturaCompetencia: p.competencia,
            dataVencimentoFatura: p.dataVencimento,
            status: 'pendente'
          }));
          await DB.bulkPut('transactions', registros);
          for (const p of parcelas) {
            await Invoices.ensure(cartaoId, p.competencia, cartao);
          }
        }
      } else {
        const registro = {
          id: rec?.id || Utils.uuid(),
          ...base,
          valor,
          formaPagamento: tipo === 'despesa' ? body.querySelector('#fForma').value : 'transferencia',
          contaId: body.querySelector('#fConta').value
        };
        await DB.put('transactions', registro);

        if (isRecorrente) {
          const recConfig = {
            id: Utils.uuid(),
            tipo,
            descricao,
            valor,
            contaId: registro.contaId,
            categoriaId: registro.categoriaId,
            subcategoriaId: registro.subcategoriaId,
            formaPagamento: registro.formaPagamento,
            frequencia: body.querySelector('#fFrequencia').value,
            dataInicial: data,
            dataFinal: body.querySelector('#fDataFinalRec').value || null,
            ativo: true
          };
          await DB.put('recurringTransactions', recConfig);
          await Recurring.materializar(recConfig);
          registro.recorrenciaId = recConfig.id;
          await DB.put('transactions', registro);
        }
      }

      UI.closeModal();
      UI.toast('Movimentação salva', 'success');
      Bus.emit('data:changed');
    };
  }
};

/* loans.js — empréstimos recebidos e dinheiro emprestado a terceiros */

const Loans = {
  async gerarLancamentos(loan) {
    const antigos = await DB.getByIndex('transactions', 'emprestimoId', loan.id);
    if (antigos.length) await DB.bulkDelete('transactions', antigos.map((t) => t.id));

    const categorias = await DB.getAll('categories');
    const catFinanceiro = categorias.find((c) => c.nome === 'Financeiro');

    const registros = [];
    registros.push({
      id: Utils.uuid(),
      tipo: loan.direcao === 'recebido' ? 'receita' : 'despesa',
      descricao: `${loan.descricao} (contratação)`,
      valor: loan.valorTotal,
      data: loan.data,
      contaId: loan.contaId,
      categoriaId: catFinanceiro?.id || null,
      formaPagamento: 'transferencia',
      status: loan.direcao === 'recebido' ? 'recebida' : 'paga',
      emprestimoId: loan.id,
      principal: true,
      criadoEm: new Date().toISOString()
    });

    const valorParcela = loan.valorParcela || Utils.round2(loan.valorTotal / loan.numeroParcelas);
    let somaParcial = 0;
    for (let i = 0; i < loan.numeroParcelas; i++) {
      const dataParcela = Utils.dateToISO(Utils.addMonths(Utils.isoToDate(loan.primeiroVencimento), i));
      let valor = valorParcela;
      if (i === loan.numeroParcelas - 1) {
        valor = Utils.round2(loan.valorTotal - somaParcial);
      } else {
        somaParcial = Utils.round2(somaParcial + valorParcela);
      }
      registros.push({
        id: Utils.uuid(),
        tipo: loan.direcao === 'recebido' ? 'despesa' : 'receita',
        descricao: `${loan.descricao} (parcela ${i + 1}/${loan.numeroParcelas})`,
        valor,
        data: dataParcela,
        contaId: loan.contaId,
        categoriaId: catFinanceiro?.id || null,
        formaPagamento: 'transferencia',
        status: 'prevista',
        emprestimoId: loan.id,
        parcelaNumero: i + 1,
        parcelaTotal: loan.numeroParcelas,
        criadoEm: new Date().toISOString()
      });
    }
    await DB.bulkPut('transactions', registros);
  },

  async resumo(loan, transacoes) {
    const devedor = Finance.saldoDevedorEmprestimo(loan, transacoes);
    const parcelas = transacoes.filter((t) => t.emprestimoId === loan.id && !t.principal).sort((a, b) => a.data.localeCompare(b.data));
    const proxima = parcelas.find((p) => ['prevista', 'pendente'].includes(p.status));
    const restantes = parcelas.filter((p) => ['prevista', 'pendente'].includes(p.status)).length;
    const pago = Utils.round2(loan.valorTotal - devedor);
    return { devedor, proxima, restantes, pago };
  }
};

      <div class="grid-3" id="investGrid"></div>
    `;

    const grid = container.querySelector('#investGrid');
    if (investimentos.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><span class="emoji">📈</span>Nenhum investimento cadastrado.</div>`;
    } else {
      grid.innerHTML = (await Promise.all(investimentos.map(async (inv) => {
        const investido = await Investments.totalInvestido(inv.id, transacoes);
        const atual = inv.valorAtual != null ? inv.valorAtual : investido;
        const rent = Utils.round2(atual - investido);
        const rentPct = investido ? Utils.round2((rent / investido) * 100) : 0;
        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between">
              <div>
                <div class="card-title" style="text-transform:none">${Utils.escapeHtml(inv.nome)}</div>
                <div class="list-meta">${Utils.escapeHtml(inv.tipo)} ${inv.instituicao ? '· ' + Utils.escapeHtml(inv.instituicao) : ''}</div>
              </div>
              <button class="icon-btn btn-edit" data-id="${inv.id}">✏️</button>
            </div>
            <div style="margin-top:10px">
              <div class="card-sub">Valor atual</div>
              <div class="card-value" style="font-size:20px">${Utils.formatCurrency(atual)}</div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:12px">
              <span class="text-muted">Investido: ${Utils.formatCurrency(investido)}</span>
              <span class="${rent >= 0 ? 'text-income' : 'text-expense'}">${rent >= 0 ? '+' : ''}${Utils.formatCurrency(rent)} (${rentPct}%)</span>
            </div>
            <button class="btn btn-sm btn-secondary btn-block btn-aporte" data-id="${inv.id}" style="margin-top:12px">+ Aporte</button>
          </div>`;
      }))).join('');

      grid.querySelectorAll('.btn-aporte').forEach((b) => b.onclick = () => Investments.openAporteForm(investimentos.find((i) => i.id === b.dataset.id)));
      grid.querySelectorAll('.btn-edit').forEach((b) => b.onclick = () => this.openForm(investimentos.find((i) => i.id === b.dataset.id)));
    }

    container.querySelector('#btnNew').onclick = () => this.openForm();
  },

  async openForm(inv) {
    const contas = await DB.getAll('accounts');
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="form-group"><label>Nome *</label><input type="text" id="fNome" value="${Utils.escapeHtml(inv?.nome || '')}" placeholder="Ex: Tesouro Selic 2029"></div>
      <div class="form-row">
        <div class="form-group"><label>Tipo *</label><select id="fTipo">${TIPOS_INVESTIMENTO.map((t) => `<option ${inv?.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="form-group"><label>Instituição</label><input type="text" id="fInstituicao" value="${Utils.escapeHtml(inv?.instituicao || '')}"></div>
      </div>
      ${!inv ? `
      <div class="form-row">
        <div class="form-group"><label>Valor investido inicial *</label><input type="number" step="0.01" id="fValorInicial" value="0"></div>
        <div class="form-group"><label>Data *</label><input type="date" id="fData" value="${Utils.todayISO()}"></div>
      </div>
      <div class="form-group"><label>Conta de origem *</label><select id="fConta">${UI.optionsHtml(contas)}</select></div>
      ` : `
      <div class="form-group"><label>Valor atual (atualize manualmente)</label><input type="number" step="0.01" id="fValorAtual" value="${inv?.valorAtual ?? ''}"></div>
      `}
      <div class="form-row">
        <div class="form-group"><label>Quantidade</label><input type="number" step="0.000001" id="fQuantidade" value="${inv?.quantidade ?? ''}"></div>
      </div>
      <div class="form-group"><label>Observação</label><textarea id="fObs">${Utils.escapeHtml(inv?.observacao || '')}</textarea></div>
      <div class="modal-actions">
        ${inv ? '<button class="btn btn-danger" id="btnDelete" style="margin-right:auto">Excluir</button>' : ''}
        <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
        <button class="btn" id="btnSave">Salvar</button>
      </div>
    `;
    const body = UI.openModal(inv ? 'Editar investimento' : 'Novo investimento', wrap);
    body.querySelector('#btnCancel').onclick = () => UI.closeModal();

    if (inv) {
      body.querySelector('#btnDelete').onclick = async () => {
        const ok = await UI.confirm('Excluir este investimento e todos os aportes registrados?', { danger: true });
        if (!ok) return;
        const aportes = await DB.getByIndex('transactions', 'investimentoId', inv.id);
        await DB.bulkDelete('transactions', aportes.map((t) => t.id));
        await DB.delete('investments', inv.id);
        UI.closeModal();
        UI.toast('Investimento excluído', 'success');
        Bus.emit('data:changed');
      };
    }

    body.querySelector('#btnSave').onclick = async () => {
      const nome = body.querySelector('#fNome').value.trim();
      if (!nome) { UI.toast('Informe o nome', 'error'); return; }

      const registro = {
        id: inv?.id || Utils.uuid(),
        nome,
        tipo: body.querySelector('#fTipo').value,
        instituicao: body.querySelector('#fInstituicao').value.trim(),
        quantidade: parseFloat(body.querySelector('#fQuantidade').value) || null,
        observacao: body.querySelector('#fObs').value.trim(),
        valorAtual: inv ? (parseFloat(body.querySelector('#fValorAtual').value) || 0) : (parseFloat(body.querySelector('#fValorInicial').value) || 0)
      };
      await DB.put('investments', registro);

      if (!inv) {
        const valorInicial = parseFloat(body.querySelector('#fValorInicial').value) || 0;
        if (valorInicial > 0) {
          await DB.put('transactions', {
            id: Utils.uuid(),
            tipo: 'investimento',
            descricao: `Aporte inicial — ${nome}`,
            valor: valorInicial,
            data: body.querySelector('#fData').value,
            contaId: body.querySelector('#fConta').value,
            investimentoId: registro.id,
            formaPagamento: 'transferencia',
            status: 'paga',
            criadoEm: new Date().toISOString()
          });
        }
      }

      UI.closeModal();
      UI.toast('Investimento salvo', 'success');
      Bus.emit('data:changed');
    };
  }
};


/* ===== js/goals.js ===== */
/* goals.js — metas financeiras */

const GoalsView = {
  async render(container) {
    const metas = await DB.getAll('goals');
    container.innerHTML = `
      <div class="section-header">
        <h2>Metas financeiras</h2>
        <button class="btn" id="btnNew">+ Nova meta</button>
      </div>
      <div class="grid-3" id="goalsGrid"></div>
    `;

    const grid = container.querySelector('#goalsGrid');
    if (metas.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><span class="emoji">🎯</span>Nenhuma meta cadastrada.</div>`;
    } else {
      grid.innerHTML = metas.map((m) => {
        const pct = m.valorObjetivo ? Math.min(100, Math.round((m.valorAtual / m.valorObjetivo) * 100)) : 0;
        let mensal = null;
        if (m.prazo) {
          const hoje = new Date();
          const prazoDate = Utils.isoToDate(m.prazo);
          const mesesRestantes = Math.max(1, (prazoDate.getFullYear() - hoje.getFullYear()) * 12 + (prazoDate.getMonth() - hoje.getMonth()));
          mensal = Utils.round2(Math.max(0, m.valorObjetivo - m.valorAtual) / mesesRestantes);
        }
        return `
          <div class="card" data-id="${m.id}">
            <div style="display:flex; justify-content:space-between">
              <div class="card-title" style="text-transform:none">${Utils.escapeHtml(m.nome)}</div>
              <button class="icon-btn btn-edit" data-id="${m.id}">✏️</button>
            </div>
            <div class="card-value" style="font-size:20px; margin-top:6px">${Utils.formatCurrency(m.valorAtual)} <span class="text-muted" style="font-size:13px; font-weight:400">/ ${Utils.formatCurrency(m.valorObjetivo)}</span></div>
            <div class="progress-bar" style="margin:10px 0"><div style="width:${pct}%"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:12px" class="text-muted">
              <span>${pct}% atingido</span>
              ${m.prazo ? `<span>Prazo: ${Utils.formatDateBR(m.prazo)}</span>` : ''}
            </div>
            ${mensal != null ? `<div class="field-hint">Guarde ~${Utils.formatCurrency(mensal)}/mês para atingir a meta.</div>` : ''}
            <button class="btn btn-sm btn-secondary btn-block btn-add" data-id="${m.id}" style="margin-top:12px">+ Adicionar valor</button>
          </div>`;
      }).join('');

      grid.querySelectorAll('.btn-edit').forEach((b) => b.onclick = () => this.openForm(metas.find((m) => m.id === b.dataset.id)));
      grid.querySelectorAll('.btn-add').forEach((b) => b.onclick = () => this.openAdd(metas.find((m) => m.id === b.dataset.id)));
    }

    container.querySelector('#btnNew').onclick = () => this.openForm();
  },

  async openAdd(meta) {
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="form-group"><label>Valor a adicionar (R$)</label><input type="number" step="0.01" id="fValor" autofocus></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
        <button class="btn" id="btnSave">Adicionar</button>
      </div>`;
    const body = UI.openModal(`Adicionar valor — ${meta.nome}`, wrap);
    body.querySelector('#btnCancel').onclick = () => UI.closeModal();
    body.querySelector('#btnSave').onclick = async () => {
      const valor = parseFloat(body.querySelector('#fValor').value) || 0;
      meta.valorAtual = Utils.round2((meta.valorAtual || 0) + valor);
      await DB.put('goals', meta);
      UI.closeModal();
      UI.toast('Meta atualizada', 'success');
      Bus.emit('data:changed');
    };
  },

  async openForm(meta) {
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="form-group"><label>Nome *</label><input type="text" id="fNome" value="${Utils.escapeHtml(meta?.nome || '')}" placeholder="Ex: Reserva de emergência"></div>
      <div class="form-row">
        <div class="form-group"><label>Valor objetivo (R$) *</label><input type="number" step="0.01" id="fObjetivo" value="${meta?.valorObjetivo ?? ''}"></div>
        <div class="form-group"><label>Valor atual (R$)</label><input type="number" step="0.01" id="fAtual" value="${meta?.valorAtual ?? 0}"></div>
      </div>
      <div class="form-group"><label>Prazo</label><input type="date" id="fPrazo" value="${meta?.prazo || ''}"></div>
      <div class="form-group"><label>Observação</label><textarea id="fObs">${Utils.escapeHtml(meta?.observacao || '')}</textarea></div>
      <div class="modal-actions">
        ${meta ? '<button class="btn btn-danger" id="btnDelete" style="margin-right:auto">Excluir</button>' : ''}
        <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
        <button class="btn" id="btnSave">Salvar</button>
      </div>
    `;
    const body = UI.openModal(meta ? 'Editar meta' : 'Nova meta', wrap);
    body.querySelector('#btnCancel').onclick = () => UI.closeModal();

    if (meta) {
      body.querySelector('#btnDelete').onclick = async () => {
        const ok = await UI.confirm('Excluir esta meta?', { danger: true });
        if (!ok) return;
        await DB.delete('goals', meta.id);
        UI.closeModal();
        UI.toast('Meta excluída', 'success');
        Bus.emit('data:changed');
      };
    }

    body.querySelector('#btnSave').onclick = async () => {
      const nome = body.querySelector('#fNome').value.trim();
      const valorObjetivo = parseFloat(body.querySelector('#fObjetivo').value);
      if (!nome) { UI.toast('Informe o nome da meta', 'error'); return; }
      if (!valorObjetivo || valorObjetivo <= 0) { UI.toast('Informe o valor objetivo', 'error'); return; }

      await DB.put('goals', {
        id: meta?.id || Utils.uuid(),
        nome,
        valorObjetivo,
        valorAtual: parseFloat(body.querySelector('#fAtual').value) || 0,
        prazo: body.querySelector('#fPrazo').value || null,
        observacao: body.querySelector('#fObs').value.trim()
      });
      UI.closeModal();
      UI.toast('Meta salva', 'success');
      Bus.emit('data:changed');
    };
  }
};


/* ===== js/calendar.js ===== */
/* calendar.js — calendário financeiro mensal */

const CalendarView = {
  competencia: null,

  async render(container, params = {}) {
    this.competencia = params.competencia || this.competencia || Utils.currentCompetencia();
    const [y, m] = this.competencia.split('-').map(Number);

    const transacoes = await DB.getAll('transactions');
    const cartoes = await DB.getAll('creditCards');
    const invoicesAll = await DB.getAll('invoices');

    const eventosPorDia = {};
    const addEvento = (data, ev) => {
      (eventosPorDia[data] = eventosPorDia[data] || []).push(ev);
    };

    transacoes.filter((t) => t.status !== 'cancelada' && t.formaPagamento !== 'creditoCartao' && t.data.slice(0, 7) === this.competencia).forEach((t) => {
      let tipoVisual = t.tipo;
      if (t.emprestimoId) tipoVisual = 'emprestimo';
      addEvento(t.data, { label: t.descricao, valor: t.valor, tipo: tipoVisual, ref: t });
    });

    invoicesAll.filter((inv) => inv.dataVencimento.slice(0, 7) === this.competencia).forEach((inv) => {
      const cartao = cartoes.find((c) => c.id === inv.cartaoId);
      const total = Invoices.totalFatura(transacoes, inv.cartaoId, inv.competencia);
      if (total > 0) addEvento(inv.dataVencimento, { label: `Fatura ${cartao?.nome || ''}`, valor: total, tipo: 'cartao', ref: inv });
    });

    const coresTipo = { receita: 'var(--color-income)', despesa: 'var(--color-expense)', cartao: 'var(--color-card)', investimento: 'var(--color-invest)', emprestimo: 'var(--color-neutral)' };

    const primeiroDiaSemana = new Date(y, m - 1, 1).getDay();
    const totalDias = Utils.daysInMonth(y, m - 1);
    const hoje = Utils.todayISO();

    let celulas = '';
    for (let i = 0; i < primeiroDiaSemana; i++) celulas += `<div class="cal-cell cal-empty"></div>`;
    for (let d = 1; d <= totalDias; d++) {
      const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const eventos = eventosPorDia[iso] || [];
      const isHoje = iso === hoje;
      celulas += `
        <div class="cal-cell ${isHoje ? 'cal-today' : ''}" data-dia="${iso}">
          <div class="cal-day-num">${d}</div>
          <div class="cal-events">
            ${eventos.slice(0, 3).map((ev) => `<div class="cal-event" style="background:${coresTipo[ev.tipo]}22;color:${coresTipo[ev.tipo]}">${Utils.escapeHtml(ev.label)}</div>`).join('')}
            ${eventos.length > 3 ? `<div class="cal-event-more">+${eventos.length - 3}</div>` : ''}
          </div>
        </div>`;
    }

    container.innerHTML = `
      <div class="month-switcher">
        <button class="icon-btn" id="btnPrev">‹</button>
        <span class="month-label">${Utils.competenciaLabel(this.competencia)}</span>
        <button class="icon-btn" id="btnNext">›</button>
        <button class="btn btn-sm btn-secondary" id="btnToday">Hoje</button>
      </div>
      <div class="chip-row" style="margin-bottom:14px">
        <span class="chip" style="background:var(--color-income-bg);color:var(--color-income)">● Receita</span>
        <span class="chip" style="background:var(--color-expense-bg);color:var(--color-expense)">● Despesa</span>
        <span class="chip" style="background:var(--color-card-bg);color:var(--color-card)">● Cartão</span>
        <span class="chip" style="background:var(--color-invest-bg);color:var(--color-invest)">● Investimento</span>
        <span class="chip" style="background:var(--color-neutral-bg);color:var(--color-neutral)">● Empréstimo</span>
      </div>
      <div class="cal-grid cal-header">
        ${['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map((d) => `<div class="cal-head-cell">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">${celulas}</div>
    `;

    container.querySelector('#btnPrev').onclick = () => App.navigate('calendario', { competencia: Utils.addMonthsToCompetencia(this.competencia, -1) });
    container.querySelector('#btnNext').onclick = () => App.navigate('calendario', { competencia: Utils.addMonthsToCompetencia(this.competencia, 1) });
    container.querySelector('#btnToday').onclick = () => App.navigate('calendario', { competencia: Utils.currentCompetencia() });

    container.querySelectorAll('.cal-cell[data-dia]').forEach((cell) => {
      cell.onclick = () => {
        const eventos = eventosPorDia[cell.dataset.dia] || [];
        if (eventos.length) this.openDayModal(cell.dataset.dia, eventos);
      };
    });
  },

  openDayModal(iso, eventos) {
    const wrap = document.createElement('div');
    wrap.innerHTML = eventos.map((ev) => `
      <div class="list-item" style="border:1px solid var(--color-border); border-radius:10px; margin-bottom:8px">
        <div class="list-icon" style="background:var(--color-neutral-bg)">${ev.tipo === 'receita' ? '💰' : ev.tipo === 'cartao' ? '💳' : ev.tipo === 'investimento' ? '📈' : ev.tipo === 'emprestimo' ? '🤝' : '🧾'}</div>
        <div class="list-main"><div class="list-title">${Utils.escapeHtml(ev.label)}</div></div>
        <div class="list-value">${Utils.formatCurrency(ev.valor)}</div>
      </div>`).join('');
    UI.openModal(Utils.formatDateBR(iso), wrap);
  }
};


/* ===== js/reports.js ===== */
/* reports.js — relatórios e análises de gastos */

const ReportsView = {
  tab: 'categoria',
  meses: 6,
  competencia: null,

  async render(container, params = {}) {
    this.tab = params.tab || this.tab;
    this.competencia = params.competencia || this.competencia || Utils.currentCompetencia();

    const transacoes = await DB.getAll('transactions');
    const categorias = await DB.getAll('categories');
    const cartoes = await DB.getAll('creditCards');
    const mapaCategorias = Object.fromEntries(categorias.map((c) => [c.id, c]));

    container.innerHTML = `
      <div class="section-header"><h2>Relatórios</h2></div>
      <div class="segmented" style="margin-bottom:18px">
        <button data-tab="categoria" class="${this.tab === 'categoria' ? 'active' : ''}">Por categoria</button>
        <button data-tab="evolucao" class="${this.tab === 'evolucao' ? 'active' : ''}">Evolução mensal</button>
        <button data-tab="cartoes" class="${this.tab === 'cartoes' ? 'active' : ''}">Cartões</button>
        <button data-tab="tipos" class="${this.tab === 'tipos' ? 'active' : ''}">Fixas x Variáveis</button>
      </div>
      <div id="reportBody"></div>
    `;
    container.querySelectorAll('.segmented button').forEach((b) => b.onclick = () => App.navigate('relatorios', { tab: b.dataset.tab }));

    const body = container.querySelector('#reportBody');

    if (this.tab === 'categoria') {
      const mapaValores = Finance.calcularDespesasPorCategoria(transacoes, this.competencia);
      const entradas = Object.entries(mapaValores).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
      const total = entradas.reduce((s, [, v]) => s + v, 0);

      body.innerHTML = `
        <div class="month-switcher">
          <button class="icon-btn" id="btnPrev">‹</button>
          <span class="month-label">${Utils.competenciaLabel(this.competencia)}</span>
          <button class="icon-btn" id="btnNext">›</button>
        </div>
        <div class="charts-grid">
          <div class="chart-card"><h3>Gastos por categoria</h3><div class="chart-wrap"><canvas id="chartCategoria"></canvas></div></div>
          <div class="chart-card">
            <h3>Detalhamento</h3>
            <div class="table-wrap" style="border:none">
              <table class="data-table">
                <tbody>
                  ${entradas.length ? entradas.map(([catId, v]) => {
                    const cat = mapaCategorias[catId];
                    const pct = total ? Math.round((v / total) * 100) : 0;
                    return `<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${cat?.cor || '#999'};margin-right:8px"></span>${Utils.escapeHtml(cat?.nome || 'Sem categoria')}</td><td style="text-align:right">${Utils.formatCurrency(v)}</td><td style="text-align:right; width:50px" class="text-muted">${pct}%</td></tr>`;
                  }).join('') : `<tr><td class="text-muted">Nenhuma despesa neste mês</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
      body.querySelector('#btnPrev').onclick = () => App.navigate('relatorios', { tab: 'categoria', competencia: Utils.addMonthsToCompetencia(this.competencia, -1) });
      body.querySelector('#btnNext').onclick = () => App.navigate('relatorios', { tab: 'categoria', competencia: Utils.addMonthsToCompetencia(this.competencia, 1) });

      Charts.doughnut('chartCategoria', entradas.map(([catId]) => mapaCategorias[catId]?.nome || 'Sem categoria'), entradas.map(([, v]) => v), entradas.map(([catId]) => mapaCategorias[catId]?.cor));
    }

    if (this.tab === 'evolucao') {
      body.innerHTML = `
        <div class="segmented" style="margin-bottom:14px">
          <button data-n="6" class="${this.meses === 6 ? 'active' : ''}">Últimos 6 meses</button>
          <button data-n="12" class="${this.meses === 12 ? 'active' : ''}">Últimos 12 meses</button>
        </div>
        <div class="chart-card"><div class="chart-wrap"><canvas id="chartEvolucao"></canvas></div></div>
      `;
      body.querySelectorAll('[data-n]').forEach((b) => b.onclick = () => { this.meses = parseInt(b.dataset.n, 10); this.render(container, { tab: 'evolucao' }); });

      const inicio = Utils.addMonthsToCompetencia(Utils.currentCompetencia(), -(this.meses - 1));
      const labels = [], entradasArr = [], saidasArr = [], saldoArr = [];
      for (let i = 0; i < this.meses; i++) {
        const comp = Utils.addMonthsToCompetencia(inicio, i);
        labels.push(Utils.competenciaLabelCurto(comp));
        const e = Finance.calcularReceitasMes(transacoes, comp);
        const s = Finance.calcularDespesasMes(transacoes, comp);
        entradasArr.push(e); saidasArr.push(s); saldoArr.push(Utils.round2(e - s));
      }
      Charts.bar('chartEvolucao', labels, [
        { label: 'Entradas', data: entradasArr, backgroundColor: '#16a34a' },
        { label: 'Saídas', data: saidasArr, backgroundColor: '#dc2626' }
      ]);
    }

    if (this.tab === 'cartoes') {
      if (cartoes.length === 0) {
        body.innerHTML = `<div class="empty-state">Nenhum cartão cadastrado.</div>`;
      } else {
        const linhas = await Promise.all(cartoes.map(async (c) => {
          const r = await Invoices.resumoCartao(c.id, transacoes);

/* ===== js/backup.js ===== */
/* backup.js — exportação/importação de dados (JSON, CSV, Excel) */

const Backup = {
  async exportarJSON() {
    const dump = await DB.exportAll();
    const json = JSON.stringify(dump, null, 2);
    const nomeArquivo = `backup-financeiro-${Utils.todayISO()}.json`;
    Utils.downloadFile(nomeArquivo, json, 'application/json');
    UI.toast('Backup exportado com sucesso', 'success');
  },

  async importarJSON(file) {
    const texto = await file.text();
    let dump;
    try {
      dump = JSON.parse(texto);
    } catch (e) {
      UI.toast('Arquivo inválido. Verifique se é um backup JSON deste sistema.', 'error');
      return;
    }
    if (!dump || typeof dump !== 'object' || !dump._meta) {
      UI.toast('Este arquivo não parece ser um backup válido.', 'error');
      return;
    }
    const ok = await UI.confirm('Importar este backup substituirá TODOS os dados atuais do sistema. Deseja continuar?', { danger: true, okLabel: 'Substituir dados' });
    if (!ok) return;
    await DB.importAll(dump);
    UI.toast('Backup restaurado com sucesso', 'success');
    Bus.emit('data:changed');
    App.navigate('dashboard');
  },

  async exportarCSV() {
    const transacoes = await DB.getAll('transactions');
    const categorias = await DB.getAll('categories');
    const contas = await DB.getAll('accounts');
    const cartoes = await DB.getAll('creditCards');
    const mapaCat = Object.fromEntries(categorias.map((c) => [c.id, c.nome]));
    const mapaContas = Object.fromEntries(contas.map((c) => [c.id, c.nome]));
    const mapaCartoes = Object.fromEntries(cartoes.map((c) => [c.id, c.nome]));

    const header = ['Data', 'Tipo', 'Descrição', 'Categoria', 'Conta', 'Cartão', 'Parcela', 'Forma de pagamento', 'Status', 'Valor'];
    const linhas = transacoes
      .sort((a, b) => a.data.localeCompare(b.data))
      .map((t) => [
        Utils.formatDateBR(t.data),
        TIPO_LABEL[t.tipo] || t.tipo,
        t.descricao,
        mapaCat[t.categoriaId] || '',
        mapaContas[t.contaId] || '',
        mapaCartoes[t.cartaoId] || '',
        t.parcelaTotal > 1 ? `${t.parcelaNumero}/${t.parcelaTotal}` : '',
        FORMA_LABEL[t.formaPagamento] || '',
        STATUS_LABEL[t.status] || t.status,
        t.valor.toFixed(2).replace('.', ',')
      ]);

    const csv = [header, ...linhas].map((row) => row.map(Utils.toCSVValue).join(';')).join('\n');
    Utils.downloadFile(`movimentacoes-${Utils.todayISO()}.csv`, '﻿' + csv, 'text/csv;charset=utf-8');
    UI.toast('CSV exportado com sucesso', 'success');
  },

  async exportarExcel() {
    if (typeof XLSX === 'undefined') {
      UI.toast('Biblioteca de exportação Excel ainda não carregou. Tente novamente em instantes.', 'error');
      return;
    }
    const transacoes = await DB.getAll('transactions');
    const categorias = await DB.getAll('categories');
    const contas = await DB.getAll('accounts');
    const cartoes = await DB.getAll('creditCards');
    const mapaCat = Object.fromEntries(categorias.map((c) => [c.id, c.nome]));
    const mapaContas = Object.fromEntries(contas.map((c) => [c.id, c.nome]));
    const mapaCartoes = Object.fromEntries(cartoes.map((c) => [c.id, c.nome]));

    const dados = transacoes.sort((a, b) => a.data.localeCompare(b.data)).map((t) => ({
      Data: Utils.formatDateBR(t.data),
      Tipo: TIPO_LABEL[t.tipo] || t.tipo,
      Descrição: t.descricao,
      Categoria: mapaCat[t.categoriaId] || '',
      Conta: mapaContas[t.contaId] || '',
      Cartão: mapaCartoes[t.cartaoId] || '',
      Parcela: t.parcelaTotal > 1 ? `${t.parcelaNumero}/${t.parcelaTotal}` : '',
      'Forma de pagamento': FORMA_LABEL[t.formaPagamento] || '',
      Status: STATUS_LABEL[t.status] || t.status,
      Valor: t.valor
    }));

    const ws = XLSX.utils.json_to_sheet(dados);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Movimentações');
    XLSX.writeFile(wb, `movimentacoes-${Utils.todayISO()}.xlsx`);
    UI.toast('Excel exportado com sucesso', 'success');
  }
};

const DashboardView = {
  competencia: null,

  async render(container, params = {}) {

    await Recurring.materializarTodas();

    const [contas, transacoes, categorias, cartoes, investimentos, loans] = await Promise.all([
      DB.getAll('accounts'), DB.getAll('transactions'), DB.getAll('categories'), DB.getAll('creditCards'), DB.getAll('investments'), DB.getAll('loans')
    ]);

    const hoje = Utils.todayISO();
    const saldoAtual = Finance.calcularSaldo(contas, transacoes, null, hoje);
    const entradasMes = Finance.calcularReceitasMes(transacoes, this.competencia);
    const despesasMes = Finance.calcularDespesasMes(transacoes, this.competencia);
    const investMes = Finance.calcularInvestimentosMes(transacoes, this.competencia);

    const compromissos30 = Finance.calcularCompromissosFuturos(transacoes, 30);
    const compromissos60 = Finance.calcularCompromissosFuturos(transacoes, 60);
    const compromissos90 = Finance.calcularCompromissosFuturos(transacoes, 90);
    const compromissos365 = Finance.calcularCompromissosFuturos(transacoes, 365);

    const disponivel = Utils.round2(saldoAtual - compromissos30.total);

    let totalFaturaAtual = 0, totalFuturoCartao = 0;
    const resumosCartao = [];
    for (const c of cartoes) {
      const r = await Invoices.resumoCartao(c.id, transacoes);
      totalFaturaAtual += r.totalFaturaAtual;
      totalFuturoCartao += r.totalFuturo;
      resumosCartao.push({ cartao: c, resumo: r });
    }

    const totalInvestido = (await Promise.all(investimentos.map((i) => Investments.totalInvestido(i.id, transacoes)))).reduce((a, b) => a + b, 0);
    const valorAtualInvest = investimentos.reduce((s, i) => s + (i.valorAtual != null ? i.valorAtual : 0), 0);

    container.innerHTML = `
      <div class="month-switcher">
        <button class="icon-btn" id="btnPrev">‹</button>
        <span class="month-label">${Utils.competenciaLabel(this.competencia)}</span>
        <button class="icon-btn" id="btnNext">›</button>
        <button class="btn btn-sm btn-secondary" id="btnToday">Hoje</button>

        <div class="card dashboard-card"><span class="icon-bg">💰</span><div class="card-title">Saldo atual</div><div class="card-value ${saldoAtual >= 0 ? 'text-income' : 'text-expense'}">${Utils.formatCurrency(saldoAtual)}</div><div class="card-sub">Entradas - saídas efetivadas</div></div>
        <div class="card dashboard-card"><span class="icon-bg">📥</span><div class="card-title">Entradas do mês</div><div class="card-value text-income">${Utils.formatCurrency(entradasMes)}</div><div class="card-sub">Recebido/previsto em ${Utils.competenciaLabelCurto(this.competencia)}</div></div>
        <div class="card dashboard-card"><span class="icon-bg">📤</span><div class="card-title">Despesas do mês</div><div class="card-value text-expense">${Utils.formatCurrency(despesasMes)}</div><div class="card-sub">Total do mês (competência)</div></div>
        <div class="card dashboard-card"><span class="icon-bg">📆</span><div class="card-title">Despesas futuras</div><div class="card-value text-expense">${Utils.formatCurrency(compromissos365.total)}</div><div class="card-sub">Comprometido nos próximos 12 meses</div></div>
        <div class="card dashboard-card"><span class="icon-bg">💳</span><div class="card-title">Cartões</div><div class="card-value" style="color:var(--color-card)">${Utils.formatCurrency(totalFaturaAtual)}</div><div class="card-sub">Fatura atual · futuro: ${Utils.formatCurrency(totalFuturoCartao)}</div></div>
        <div class="card dashboard-card"><span class="icon-bg">📈</span><div class="card-title">Investimentos</div><div class="card-value text-invest">${Utils.formatCurrency(valorAtualInvest)}</div><div class="card-sub">Investido: ${Utils.formatCurrency(totalInvestido)}</div></div>
        <div class="card dashboard-card"><span class="icon-bg">✅</span><div class="card-title">Disponível</div><div class="card-value ${disponivel >= 0 ? 'text-income' : 'text-expense'}">${Utils.formatCurrency(disponivel)}</div><div class="card-sub">Saldo - compromissos próx. 30 dias</div></div>
        <div class="card dashboard-card"><span class="icon-bg">📊</span><div class="card-title">Saldo do mês</div><div class="card-value ${(entradasMes - despesasMes) >= 0 ? 'text-income' : 'text-expense'}">${Utils.formatCurrency(Utils.round2(entradasMes - despesasMes - investMes))}</div><div class="card-sub">Entradas - saídas - investido</div></div>
      </div>

      <div class="section">
        <div class="section-header"><h2>Compromissos futuros</h2></div>

          <div class="commitment-item"><div class="value text-expense">${Utils.formatCurrency(compromissos30.total)}</div><div class="label">Próximos 30 dias</div></div>

          <div class="commitment-item"><div class="value text-expense">${Utils.formatCurrency(compromissos90.total)}</div><div class="label">Próximos 90 dias</div></div>
          <div class="commitment-item"><div class="value text-expense">${Utils.formatCurrency(compromissos365.total)}</div><div class="label">Próximos 12 meses</div></div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card"><h3>Gastos por categoria (${Utils.competenciaLabelCurto(this.competencia)})</h3><div class="chart-wrap"><canvas id="chartCategoria"></canvas></div></div>
        <div class="chart-card">
          <h3>Avisos</h3>
          <div class="insights-list" id="insightsList"></div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card"><h3>Entradas x Saídas (6 meses)</h3><div class="chart-wrap small"><canvas id="chartEntradasSaidas"></canvas></div></div>
        <div class="chart-card"><h3>Evolução do saldo</h3><div class="chart-wrap small"><canvas id="chartSaldo"></canvas></div></div>
      </div>

      <div class="charts-grid">
        <div class="chart-card"><h3>Gastos no cartão</h3><div class="chart-wrap small"><canvas id="chartCartoes"></canvas></div></div>
        <div class="chart-card"><h3>Investimentos</h3><div class="chart-wrap small"><canvas id="chartInvest"></canvas></div></div>
      </div>
    `;

    container.querySelector('#btnPrev').onclick = () => App.navigate('dashboard', { competencia: Utils.addMonthsToCompetencia(this.competencia, -1) });
    container.querySelector('#btnNext').onclick = () => App.navigate('dashboard', { competencia: Utils.addMonthsToCompetencia(this.competencia, 1) });
    container.querySelector('#btnToday').onclick = () => App.navigate('dashboard', { competencia: Utils.currentCompetencia() });

    // Gastos por categoria
    const porCategoria = Finance.calcularDespesasPorCategoria(transacoes, this.competencia);
    const catEntries = Object.entries(porCategoria).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    const mapaCategorias = Object.fromEntries(categorias.map((c) => [c.id, c]));
    Charts.doughnut('chartCategoria', catEntries.map(([id]) => mapaCategorias[id]?.nome || 'Sem categoria'), catEntries.map(([, v]) => v), catEntries.map(([id]) => mapaCategorias[id]?.cor));

    // Entradas x saídas (6 meses) + evolução do saldo
    const inicio6 = Utils.addMonthsToCompetencia(Utils.currentCompetencia(), -5);
    const labels6 = [], entradasArr = [], saidasArr = [], saldoEvolArr = [];
    for (let i = 0; i < 6; i++) {
      const comp = Utils.addMonthsToCompetencia(inicio6, i);
      labels6.push(Utils.competenciaLabelCurto(comp));
      entradasArr.push(Finance.calcularReceitasMes(transacoes, comp));
      saidasArr.push(Finance.calcularDespesasMes(transacoes, comp));
      const [y, m] = comp.split('-').map(Number);
      const ultimoDiaMes = Utils.dateToISO(new Date(y, m, 0));
      saldoEvolArr.push(Finance.calcularSaldo(contas, transacoes, null, ultimoDiaMes < hoje ? ultimoDiaMes : hoje));
    }
    Charts.bar('chartEntradasSaidas', labels6, [
      { label: 'Entradas', data: entradasArr, backgroundColor: '#16a34a' },
      { label: 'Saídas', data: saidasArr, backgroundColor: '#dc2626' }
    ]);
    Charts.line('chartSaldo', labels6, [{ label: 'Saldo', data: saldoEvolArr, borderColor: '#0ea5e9', backgroundColor: 'rgba(14,165,233,.12)' }]);

    // Gastos no cartão
    Charts.bar('chartCartoes', resumosCartao.map((r) => r.cartao.nome), [
      { label: 'Fatura atual', data: resumosCartao.map((r) => r.resumo.totalFaturaAtual), backgroundColor: resumosCartao.map((r) => r.cartao.cor) }
    ]);

    // Investimentos
    Charts.bar('chartInvest', investimentos.map((i) => i.nome), [
      { label: 'Valor atual', data: investimentos.map((i) => i.valorAtual || 0), backgroundColor: '#7c3aed' }
    ]);

    this.renderInsights(container.querySelector('#insightsList'), { entradasMes, totalFaturaAtual, transacoes, resumosCartao, compromissos30 });
  },

  renderInsights(el, ctx) {
    const avisos = [];
    if (ctx.entradasMes > 0 && ctx.totalFaturaAtual > 0) {
      const pct = Math.round((ctx.totalFaturaAtual / ctx.entradasMes) * 100);
      if (pct >= 30) avisos.push({ tipo: 'warn', texto: `⚠️ Sua fatura atual representa ${pct}% da sua renda do mês.` });
    }
    if (ctx.compromissos30.cartoes > 0) {
      avisos.push({ tipo: 'info', texto: `💳 Você possui ${Utils.formatCurrency(ctx.compromissos30.cartoes)} em parcelas de cartão nos próximos 30 dias.` });
    }
    if (ctx.compromissos30.contasFixas > 0) {
      avisos.push({ tipo: 'info', texto: `ℹ️ Você possui ${Utils.formatCurrency(ctx.compromissos30.contasFixas)} em contas fixas nos próximos 30 dias.` });
    }
    const proximaDespesa = ctx.transacoes
      .filter((t) => t.tipo === 'despesa' && ['prevista', 'pendente'].includes(t.status) && t.formaPagamento !== 'creditoCartao' && t.data >= Utils.todayISO())
      .sort((a, b) => a.data.localeCompare(b.data))[0];
    if (proximaDespesa) {
      avisos.push({ tipo: 'info', texto: `📅 Próximo vencimento: ${proximaDespesa.descricao} — ${Utils.formatDateBR(proximaDespesa.data)}.` });
    }
    if (avisos.length === 0) {
      avisos.push({ tipo: 'ok', texto: '✅ Nenhum alerta no momento. Suas finanças estão sob controle.' });
    }
    el.innerHTML = avisos.map((a) => `<div class="alert-box ${a.tipo === 'warn' ? 'warn' : a.tipo === 'ok' ? 'ok' : ''}">${a.texto}</div>`).join('');
  }
};


/* ===== js/search.js ===== */
/* search.js — busca global */

const GlobalSearch = {
  async buscar(termo) {
    const t = termo.trim().toLowerCase();
    if (!t) return {};

    const [transacoes, contas, categorias, cartoes] = await Promise.all([
      DB.getAll('transactions'), DB.getAll('accounts'), DB.getAll('categories'), DB.getAll('creditCards')
    ]);

    const lancamentos = transacoes.filter((x) => x.descricao?.toLowerCase().includes(t)).slice(0, 30);
    const contasEnc = contas.filter((x) => x.nome?.toLowerCase().includes(t));
    const categoriasEnc = categorias.filter((x) => x.nome?.toLowerCase().includes(t));
    const cartoesEnc = cartoes.filter((x) => x.nome?.toLowerCase().includes(t));

    return { lancamentos, contasEnc, categoriasEnc, cartoesEnc };
  },

  renderResults(container, results) {
    const { lancamentos = [], contasEnc = [], categoriasEnc = [], cartoesEnc = [] } = results;
    const total = lancamentos.length + contasEnc.length + categoriasEnc.length + cartoesEnc.length;

    if (total === 0) {
      container.innerHTML = `<div class="empty-state"><span class="emoji">🔎</span>Nenhum resultado encontrado.</div>`;
      return;
    }

    let html = '';
    if (lancamentos.length) {
      html += `<div class="search-group-title">Lançamentos</div>`;
      html += lancamentos.map((t) => `
        <div class="list-item search-result" data-type="tx" data-id="${t.id}" style="cursor:pointer">
          <div class="list-icon" style="background:var(--color-neutral-bg)">💸</div>
          <div class="list-main"><div class="list-title">${Utils.escapeHtml(t.descricao)}</div><div class="list-meta">${Utils.formatDateBR(t.data)}</div></div>
          <div class="list-value">${Utils.formatCurrency(t.valor)}</div>
        </div>`).join('');
    }
    if (cartoesEnc.length) {
      html += `<div class="search-group-title">Cartões</div>`;
      html += cartoesEnc.map((c) => `
        <div class="list-item search-result" data-type="cartao" data-id="${c.id}" style="cursor:pointer">
          <div class="list-icon" style="background:${c.cor}22;color:${c.cor}">💳</div>
          <div class="list-main"><div class="list-title">${Utils.escapeHtml(c.nome)}</div></div>
        </div>`).join('');
    }
    if (contasEnc.length) {
      html += `<div class="search-group-title">Contas</div>`;
      html += contasEnc.map((c) => `
        <div class="list-item search-result" data-type="conta" data-id="${c.id}" style="cursor:pointer">
          <div class="list-icon" style="background:${c.cor}22;color:${c.cor}">🏦</div>
          <div class="list-main"><div class="list-title">${Utils.escapeHtml(c.nome)}</div></div>
        </div>`).join('');
    }
    if (categoriasEnc.length) {
      html += `<div class="search-group-title">Categorias</div>`;
      html += categoriasEnc.map((c) => `
        <div class="list-item search-result" data-type="categoria" data-id="${c.id}" style="cursor:pointer">
          <div class="list-icon" style="background:${c.cor}22;color:${c.cor}">🏷️</div>
          <div class="list-main"><div class="list-title">${Utils.escapeHtml(c.nome)}</div></div>
        </div>`).join('');
    }
    container.innerHTML = html;

    container.querySelectorAll('.search-result').forEach((el) => {
      el.onclick = async () => {
        document.getElementById('searchOverlay').classList.remove('open');
        const type = el.dataset.type;
        if (type === 'tx') {
          const tx = (await DB.getAll('transactions')).find((t) => t.id === el.dataset.id);
          App.navigate('movimentacoes');
          setTimeout(() => tx && TransactionsView.openEditDispatcher(tx), 250);
        } else if (type === 'cartao') {
          App.navigate('faturas', { cartaoId: el.dataset.id });
        } else if (type === 'conta') {
          App.navigate('contas');
        } else if (type === 'categoria') {
          App.navigate('configuracoes', { tab: 'categorias' });
        }
      };
    });
  }
};

document.addEventListener('DOMContentLoaded', () => {
  const overlay = document.getElementById('searchOverlay');
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');

  document.getElementById('btnSearch').onclick = () => {
    overlay.classList.add('open');
    input.value = '';
    results.innerHTML = '';
    setTimeout(() => input.focus(), 50);
  };
  document.getElementById('searchClose').onclick = () => overlay.classList.remove('open');

  input.addEventListener('input', Utils.debounce(async (e) => {
    const r = await GlobalSearch.buscar(e.target.value);
    GlobalSearch.renderResults(results, r);
  }, 250));
});
