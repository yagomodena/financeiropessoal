    this.applyStoredTheme();

    await this.checkFirstRun();

    // 'popstate' cobre voltar/avançar do navegador (pushState não dispara 'hashchange');
    // 'hashchange' cobre links digitados/colados diretamente na barra de endereço.
    window.addEventListener('popstate', () => this.handleHashChange());
    window.addEventListener('hashchange', () => this.handleHashChange());
    this.handleHashChange();

    Bus.on('data:changed', () => this.renderCurrent());
  },

  buildNav() {
    const sideNav = document.getElementById('sidebarNav');
    sideNav.innerHTML = Object.entries(ROUTES).map(([key, r]) => `
      <button class="nav-item" data-route="${key}"><span class="nav-icon">${r.icon}</span>${r.label}</button>
    `).join('');
    sideNav.querySelectorAll('.nav-item').forEach((b) => b.onclick = () => this.navigate(b.dataset.route));

    const bottomNav = document.getElementById('bottomNav');
    const bottomRoutes = Object.entries(ROUTES).filter(([, r]) => r.inBottom);
    bottomNav.innerHTML = bottomRoutes.map(([key, r]) => `
      <button class="nav-item" data-route="${key}"><span class="nav-icon">${r.icon}</span>${r.label}</button>
    `).join('') + `<button class="nav-item" id="btnMore"><span class="nav-icon">☰</span>Mais</button>`;
    bottomNav.querySelectorAll('[data-route]').forEach((b) => b.onclick = () => this.navigate(b.dataset.route));
    document.getElementById('btnMore').onclick = () => document.getElementById('sidebar').classList.add('open');
  },

  bindGlobalUI() {
    document.getElementById('btnOpenMenu').onclick = () => document.getElementById('sidebar').classList.add('open');
    document.addEventListener('click', (e) => {
      const sidebar = document.getElementById('sidebar');
      if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && e.target.id !== 'btnOpenMenu' && e.target.id !== 'btnMore') {
        sidebar.classList.remove('open');
      }
    });

    document.getElementById('btnToggleTheme').onclick = () => {
      const atual = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      this.setTheme(atual === 'dark' ? 'light' : 'dark');
    };

    const fab = document.getElementById('fabAdd');
    const fabMenu = document.getElementById('fabMenu');
    const fabBackdrop = document.getElementById('fabBackdrop');
    fabMenu.innerHTML = FAB_ITEMS.map((it, i) => `<button data-i="${i}">${it.icon} ${it.label}</button>`).join('');
    const closeFab = () => { fabMenu.classList.remove('open'); fabBackdrop.classList.remove('open'); };
    fab.onclick = () => { fabMenu.classList.toggle('open'); fabBackdrop.classList.toggle('open'); };
    fabBackdrop.onclick = closeFab;
    fabMenu.querySelectorAll('button').forEach((b) => b.onclick = () => { closeFab(); FAB_ITEMS[b.dataset.i].action(); });
  },

  applyStoredTheme() {
    const saved = localStorage.getItem('cf_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  },

  setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('cf_theme', theme); } catch (e) { /* ignora indisponibilidade de storage */ }
    this.renderCurrent();
  },

  async checkFirstRun() {
    const setting = await DB.get('settings', 'onboarded');
    if (setting) return;
    await DB.put('settings', { key: 'onboarded', value: true });

    const contas = await DB.getAll('accounts');
    if (contas.length > 0) return;

    const carregar = await UI.confirm('Bem-vindo! Deseja carregar dados de demonstração para testar o sistema imediatamente?', { okLabel: 'Carregar demonstração', cancelLabel: 'Começar vazio', title: 'Primeiro acesso' });
    if (carregar) {
      await Seed.gerarDadosDemo();
      UI.toast('Dados de demonstração carregados', 'success');
    }
  },

  navigate(route, params = {}) {
    const query = new URLSearchParams(params).toString();
    const novoHash = `#/${route}${query ? '?' + query : ''}`;
    document.getElementById('sidebar').classList.remove('open');

    // Atualiza a URL para permitir voltar/avançar e compartilhar links,
    // mas não depende do evento 'hashchange' para renderizar: em alguns
    // navegadores (extensões corporativas, restrições em file://) esse
    // evento pode não disparar, então a navegação é aplicada diretamente.
    if (location.hash !== novoHash) {
      try { history.pushState(null, '', novoHash); } catch (e) { location.hash = novoHash; }
    }
    this.currentRoute = ROUTES[route] ? route : 'dashboard';
    this.currentParams = params;
    this.renderCurrent();
  },

  handleHashChange() {
    const hash = location.hash.replace(/^#\//, '');
    const [route, queryStr] = hash.split('?');
    const params = Object.fromEntries(new URLSearchParams(queryStr || ''));
    const novaRota = ROUTES[route] ? route : 'dashboard';

    if (novaRota === this.currentRoute && JSON.stringify(params) === JSON.stringify(this.currentParams)) {
      return;
    }
    this.currentRoute = novaRota;
    this.currentParams = params;
    this.renderCurrent();
  },

  async renderCurrent() {
    const routeInfo = ROUTES[this.currentRoute];
    document.getElementById('topbarTitle').textContent = routeInfo.label;
    document.querySelectorAll('.nav-item[data-route]').forEach((b) => b.classList.toggle('active', b.dataset.route === this.currentRoute));

    const container = document.getElementById('view');
    try {
      await routeInfo.view.render(container, this.currentParams);
    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="empty-state"><span class="emoji">⚠️</span>Ocorreu um erro ao carregar esta tela.<br><span style="font-size:11px">${Utils.escapeHtml(err.message)}</span></div>`;
    }
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());


</script>
</body>
</html>
